name: Publish Beard's Classroom

on:
  push:
    paths:
      - site.zip
      - 'passages/**'
      - .github/workflows/publish-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare website ZIP and passage text files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import zipfile

          archive = Path('site.zip')
          destination = Path('_site')
          if not archive.is_file():
              raise SystemExit('Upload the website ZIP to the repository root and name it site.zip.')
          if destination.is_symlink():
              destination.unlink()
          elif destination.exists():
              if destination.is_dir():
                  shutil.rmtree(destination)
              else:
                  destination.unlink()
          destination.mkdir()
          with zipfile.ZipFile(archive) as source:
              members = source.infolist()
              if len(members) > 10000 or sum(item.file_size for item in members) > 100_000_000:
                  raise SystemExit('The website ZIP is too large to publish (100 MB extracted limit).')
              checked = []
              seen = set()
              for item in members:
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or chr(92) in item.filename:
                      raise SystemExit('Unsafe ZIP filename: ' + item.filename)
                  if path.parts and (':' in path.parts[0] or path.parts[0] == '.github'):
                      if path.parts[0] == '.github':
                          continue
                      raise SystemExit('Unsafe ZIP filename: ' + item.filename)
                  mode = item.external_attr >> 16
                  if stat.S_ISLNK(mode) or item.flag_bits & 1:
                      raise SystemExit('Links and encrypted entries are not supported: ' + item.filename)
                  if not item.is_dir():
                      normalized = path.as_posix()
                      if normalized in seen:
                          raise SystemExit('Duplicate ZIP filename: ' + item.filename)
                      seen.add(normalized)
                  checked.append(item)
              for item in checked:
                  source.extract(item, destination)
          if not (destination / 'index.html').is_file():
              raise SystemExit('Zip the website contents, with index.html at the ZIP root.')
          overlay = Path('passages')
          if overlay.exists() or overlay.is_symlink():
              if overlay.is_symlink() or not overlay.is_dir():
                  raise SystemExit('The repository passages path must be an ordinary folder.')
              bundled_passages = destination / 'passages'
              if bundled_passages.is_dir():
                  shutil.rmtree(bundled_passages)
              elif bundled_passages.exists():
                  bundled_passages.unlink()
              bundled_passages.mkdir(parents=True)
              for item in overlay.rglob('*'):
                  if item.is_symlink():
                      raise SystemExit('Symbolic links are not supported in passages: ' + str(item))
                  if item.is_file():
                      target = destination / 'passages' / item.relative_to(overlay)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(item, target)
          builder = destination / 'scripts' / 'build_custom_fluency.py'
          if not builder.is_file():
              raise SystemExit('Use site.zip version v01.0016 or later; it contains the custom-passage builder.')
          PY
          python3 _site/scripts/build_custom_fluency.py --site-root _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
