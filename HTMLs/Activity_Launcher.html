<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beard's Classroom Activity</title>
  <style>
    :root{--navy:#1e4767;--blue:#2878a9;--cream:#fffdf7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef8fd;font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;color:#273b4c}.launcher-header{height:64px;display:flex;align-items:center;gap:1rem;padding:.7rem 1rem;background:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(15,49,77,.22);position:relative;z-index:2}.home-link{color:#fff;text-decoration:none;font-weight:800;padding:.5rem .7rem;border:1px solid rgba(255,255,255,.45);border-radius:8px;white-space:nowrap}.home-link:hover,.home-link:focus{background:rgba(255,255,255,.15);outline:none}.activity-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"Comic Sans MS","Chalkboard SE",sans-serif;font-size:1.1rem}.direct-link{margin-left:auto;color:#d8f3ff;font-size:.85rem;white-space:nowrap}.frame{display:block;border:0;width:100%;height:calc(100vh - 64px);background:#eff9ff}.error{max-width:600px;margin:4rem auto;background:#fff;padding:2rem;border-radius:18px;box-shadow:0 8px 24px rgba(30,71,103,.12);line-height:1.5}.error a{color:#1d6495;font-weight:800}@media(max-width:600px){.launcher-header{gap:.55rem;padding:.6rem}.activity-name{font-size:.9rem}.direct-link{display:none}.frame{height:calc(100vh - 58px)}}
  </style>
</head>
<body>
  <header class="launcher-header"><a class="home-link" href="../index.html">← Home</a><strong class="activity-name" id="activity-name">Opening activity…</strong><a class="direct-link" id="direct-link" target="_blank" rel="noopener">Open directly ↗</a></header>
  <main id="main"></main>
  <script>
    const main=document.querySelector('#main'),title=document.querySelector('#activity-name'),direct=document.querySelector('#direct-link');
    const requested=new URLSearchParams(location.search).get('activity')||'';
    const valid=requested.startsWith('HTMLs/')&&!requested.includes('..')&&/\.html(?:\.html)?$/i.test(requested);
    if(!valid){main.innerHTML='<section class="error"><h1>Activity not found</h1><p>Please return to Beard\'s Classroom and choose an activity from the menu.</p><p><a href="../index.html">Return home</a></p></section>';title.textContent='Choose an activity';direct.remove();}else{const frame=document.createElement('iframe');frame.className='frame';frame.title='Beard\'s Classroom activity';const source=new URL('../'+requested,location.href);frame.src=source.href;direct.href=source.href;title.textContent=decodeURIComponent(requested.split('/').pop().replace(/\.html(?:\.html)?$/i,'').replaceAll('_',' '));main.append(frame);frame.addEventListener('load',()=>enhance(frame));}

    function enhance(frame){
      let doc;try{doc=frame.contentDocument}catch{return}if(!doc||doc.getElementById('beard-shell-style'))return;
      const win=frame.contentWindow,sourceUrl=win.location.href;
      direct.href=sourceUrl;title.textContent=doc.title||decodeURIComponent(sourceUrl.split('/').pop().replace(/\.html(?:\.html)?$/i,'').replaceAll('_',' '));
      const isFluency=Boolean(doc.querySelector('#passage .word,#passage')&&doc.querySelector('#colorSelect')&&doc.querySelector('#studentSelect'));
      const isFluencyHub=/\/Reading Fluency\/Fluency Passages\.html$/i.test(decodeURIComponent(new URL(sourceUrl).pathname));
      addShellStyles(doc,isFluency,isFluencyHub);
      if(isFluencyHub){wireInternalLinks(doc,frame,sourceUrl);return}
      const hud=makeHud(doc,isFluency);const clock=makeClock(doc,hud);
      if(isFluency)enhanceFluency(doc,win,hud,clock);else enhanceAssessment(doc,win,hud,clock,frame,sourceUrl);
      wireInternalLinks(doc,frame,sourceUrl);
    }

    function addShellStyles(doc,isFluency,isFluencyHub=false){
      const topPadding=isFluencyHub?'28px':'94px',mobileTopPadding=isFluencyHub?'28px':'126px';
      const style=doc.createElement('style');style.id='beard-shell-style';style.textContent=`
        :root{--beard-navy:#1e4767;--beard-blue:#2878a9;--beard-sky:#e9f7ff;--beard-cream:#fffdf7;--beard-line:#d3e4ed;--beard-green:#237f4e;--beard-red:#bd4141;--beard-gold:#e7b840}html,body{min-height:100%!important}body{background:linear-gradient(135deg,#e8f6ff,#fff9e9)!important;color:#26394b!important;padding-top:${topPadding}!important;padding-bottom:28px!important;font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif!important}h1,h2,h3{color:var(--beard-navy)!important}button{background:var(--beard-blue)!important;color:#fff!important;border:0!important;border-radius:10px!important;padding:.65rem 1rem!important;font-weight:800!important;box-shadow:0 3px 0 rgba(20,73,111,.18)!important;transition:transform .12s ease,filter .12s ease!important}button:hover,button:focus{filter:brightness(.94)!important;transform:translateY(-1px)!important;outline:3px solid #a7def8!important;outline-offset:2px!important}button.danger,.reset,#reset,.btn-red{background:#c85b56!important}input,select,textarea{border:2px solid var(--beard-line)!important;border-radius:9px!important;background:#fff!important;color:#26394b!important}#score,#attempts,#timer{display:none!important}#feedback,#result{min-height:2.6rem!important;margin-top:.85rem!important;padding:.65rem .85rem!important;border-radius:10px!important;background:rgba(255,255,255,.78)!important;font-size:1.12rem!important;font-weight:850!important;text-align:center!important}#summary,#results{border:3px solid #fff!important;box-shadow:0 8px 24px rgba(30,71,103,.15)!important}.beard-chip{position:fixed;z-index:9999;background:rgba(255,253,247,.98);border:2px solid #fff;box-shadow:0 4px 12px rgba(30,71,103,.16);border-radius:11px;padding:.55rem .75rem;color:var(--beard-navy);font:850 1rem/1.2 "Avenir Next",Avenir,"Segoe UI",sans-serif;letter-spacing:.01em}.beard-top-left{top:14px;left:14px}.beard-top-right{top:14px;right:14px}.beard-bottom-left{bottom:14px;left:14px}.beard-bottom-right{bottom:14px;right:14px}.beard-feedback{position:fixed;z-index:9998;top:76px;left:50%;transform:translateX(-50%);max-width:min(430px,calc(100vw - 28px));padding:.55rem .85rem;border-radius:10px;background:rgba(255,253,247,.98);box-shadow:0 4px 12px rgba(30,71,103,.14);font:850 1rem/1.25 "Avenir Next",Avenir,"Segoe UI",sans-serif;text-align:center;opacity:0;transition:opacity .16s ease;pointer-events:none}.beard-feedback.show{opacity:1}.beard-feedback.good{color:var(--beard-green)}.beard-feedback.bad{color:var(--beard-red)}.beard-feedback.neutral{color:var(--beard-navy)}.beard-fluency-hint{margin:0 0 .45rem!important;padding:.65rem!important;border-radius:9px!important;background:#fff7d4!important;color:#294c67!important;font-size:.88rem!important;line-height:1.4!important}.beard-error-word{outline:3px solid var(--beard-red)!important;outline-offset:1px;border-radius:5px;position:relative}.beard-error-word::after{content:"×";position:absolute;top:-12px;right:-5px;width:17px;height:17px;border-radius:50%;background:var(--beard-red);color:#fff;font:900 15px/16px Arial;text-align:center}.beard-selected-word{box-shadow:0 0 0 3px var(--beard-gold)!important}.beard-fluency-summary{position:fixed;z-index:10001;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(20,49,71,.5);font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif}.beard-fluency-summary-card{width:min(570px,100%);background:var(--beard-cream);color:#26394b;border:4px solid #fff;border-radius:18px;padding:1.35rem;box-shadow:0 16px 45px rgba(0,0,0,.25)}.beard-fluency-summary-card h2{margin:.1rem 0 .8rem;color:var(--beard-navy);font-family:"Comic Sans MS","Chalkboard SE",sans-serif}.beard-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem;margin:1rem 0}.beard-summary-grid div{padding:.7rem;border-radius:10px;background:#edf7fb}.beard-summary-grid b{display:block;color:#47667e;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}.beard-summary-actions{display:flex;justify-content:flex-end;gap:.6rem;flex-wrap:wrap}.beard-answer-history{margin:1rem 0;padding:.85rem;border:1px solid var(--beard-line);border-radius:12px;background:#f4fbff}.beard-answer-history h3{margin:0 0 .65rem;color:var(--beard-navy);font-size:1rem}.beard-answer-history table{width:100%;border-collapse:collapse;font-size:.92rem}.beard-answer-history th,.beard-answer-history td{padding:.55rem;text-align:left;border-bottom:1px solid #dbeaf1}.beard-answer-history th{color:#47667e;font-size:.76rem;letter-spacing:.04em;text-transform:uppercase}.beard-answer-history tr:last-child td{border-bottom:0}.beard-answer-history .good{color:var(--beard-green);font-weight:850}.beard-answer-history .bad{color:var(--beard-red);font-weight:850}.beard-answer-history .pending{color:#8a6421;font-weight:850}#beard-teacher-banner{position:fixed;z-index:10000;top:0;left:0;right:0;min-height:64px;display:grid;grid-template-columns:auto minmax(130px,1fr) auto;gap:.65rem;align-items:center;padding:.5rem .75rem;background:var(--beard-navy);box-shadow:0 3px 12px rgba(20,54,81,.28);font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif}#beard-teacher-banner .beard-chip{position:static;z-index:auto;border:0;box-shadow:none;border-radius:8px;background:rgba(255,253,247,.98);padding:.46rem .62rem;font-size:.9rem;white-space:nowrap}#beard-teacher-banner .beard-banner-center{min-width:0;text-align:center;color:#fff;line-height:1.15}#beard-teacher-banner .beard-banner-center strong,#beard-teacher-banner .beard-banner-center span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#beard-teacher-banner .beard-banner-center strong{font-family:"Comic Sans MS","Chalkboard SE",sans-serif;font-size:1rem}#beard-teacher-banner .beard-banner-center span{font-size:.72rem;opacity:.82;margin-top:.12rem}#beard-teacher-banner .beard-banner-metrics{display:flex;gap:.35rem;align-items:center;justify-content:flex-end;flex-wrap:wrap}.beard-feedback{top:76px}@media(max-width:620px){body{padding-top:${mobileTopPadding}!important;padding-bottom:66px!important}#beard-teacher-banner{min-height:104px;grid-template-columns:auto 1fr;padding:.45rem .55rem;gap:.35rem}#beard-teacher-banner .beard-banner-metrics{grid-column:1/-1;justify-content:center}#beard-teacher-banner .beard-chip{font-size:.8rem;padding:.4rem .46rem}.beard-feedback{top:112px;font-size:.9rem}.beard-bottom-right{bottom:10px;right:10px}.beard-summary-grid{grid-template-columns:1fr}}
      `;doc.head.append(style);
    }

      function makeHud(doc,isFluency){
        const banner=doc.createElement('header');
        banner.id='beard-teacher-banner';
        banner.setAttribute('aria-label','Teacher information');
        const makeChip=(id,text)=>{
          const el=doc.createElement('div');
          el.id=id;
          el.className='beard-chip';
          el.textContent=text;
          return el;
        };
        const countdown=makeChip('beard-countdown','Countdown: 1:00');
        const center=doc.createElement('div');
        center.className='beard-banner-center';
        const brand=doc.createElement('strong');
        brand.textContent="Beard's Classroom";
        const activity=doc.createElement('span');
        activity.textContent=doc.title||'Goal Check';
        center.append(brand,activity);
        const metrics=doc.createElement('div');
        metrics.className='beard-banner-metrics';
        const percent=makeChip('beard-percent',isFluency?'Accuracy: —':'Score: 0%');
        const errors=makeChip('beard-errors','Errors: 0');
        metrics.append(percent);
        let attempts;
        if(!isFluency){
          attempts=makeChip('beard-attempts','Attempts: 0');
          metrics.append(attempts);
        }
        metrics.append(errors);
        banner.append(countdown,center,metrics);
        doc.body.append(banner);
        const feedback=doc.createElement('div');
        feedback.id='beard-feedback';
        feedback.className='beard-feedback';
        doc.body.append(feedback);
        return {countdown,percent,errors,attempts,feedback};
      }

    function makeClock(doc,hud){
      let startedAt=null,timer=null,rang=false,pausedAt=null,pausedMs=0;
      let audioContext=null;
      const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
      function unlock(){try{audioContext??=new (doc.defaultView.AudioContext||doc.defaultView.webkitAudioContext)();audioContext.resume?.()}catch{}}
      function chime(){if(rang)return;rang=true;try{unlock();if(!audioContext)return;const now=audioContext.currentTime,gain=audioContext.createGain();gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.22,now+.03);gain.gain.exponentialRampToValueAtTime(.001,now+.8);gain.connect(audioContext.destination);[740,988].forEach((frequency,index)=>{const osc=audioContext.createOscillator();osc.type='sine';osc.frequency.setValueAtTime(frequency,now+index*.12);osc.connect(gain);osc.start(now+index*.12);osc.stop(now+.8)});}catch{}}
      function elapsedMilliseconds(){if(!startedAt)return 0;const end=pausedAt??Date.now();return Math.max(0,end-startedAt-pausedMs)}
      function elapsed(){return Math.floor(elapsedMilliseconds()/1000)}
      function render(){const seconds=elapsed(),left=60-seconds;hud.countdown.textContent=left>=0?`Countdown: ${fmt(left)}`:`Overtime: +${fmt(-left)}`;if(seconds>=60)chime()}
      function tick(){render()}
      function start({restart=false}={}){unlock();if(restart||!startedAt){startedAt=Date.now();pausedAt=null;pausedMs=0;rang=false}else if(pausedAt){pausedMs+=Date.now()-pausedAt;pausedAt=null}if(!timer)timer=setInterval(tick,250);render()}
      function stop(){if(!startedAt||pausedAt)return;pausedAt=Date.now();if(timer){clearInterval(timer);timer=null}render()}
      function reset(){startedAt=null;pausedAt=null;pausedMs=0;rang=false;if(timer){clearInterval(timer);timer=null}hud.countdown.textContent='Countdown: 1:00'}
      doc.addEventListener('pointerdown',unlock,{once:true,capture:true});doc.addEventListener('keydown',unlock,{once:true,capture:true});
      return{start,stop,reset,elapsed,elapsedMilliseconds,render};
    }

    function enhanceAssessment(doc,win,hud,clock,frame,sourceUrl){
      let attempts=0,errors=0,unscored=false,feedbackTimer,ended=false,runId=0,feedbackQueued=false,nativeCorrect=0,answerHistory=[],questionStartedAt=0;
      const isSentenceFill=/sentence fill/i.test(doc.title);
      const isMathAssessment=/\/HTMLs\/Math\//i.test(decodeURIComponent(new URL(sourceUrl).pathname));
      const nativeAttemptsEl=isMathAssessment?doc.querySelector('#attempts'):null;
      const nativeScoreEl=isMathAssessment?doc.querySelector('#score'):null;
      const usesNativeMathCounters=Boolean(nativeAttemptsEl&&nativeScoreEl);
      const resultEl=doc.querySelector('#result');
      const resultIsAssessment=resultEl&&doc.querySelector('#summary,#results,.summary,#score,#attempts');
      const questionFeedback=doc.querySelector('#feedback,[role="status"]')||(resultIsAssessment?resultEl:null);
      const feedbackTarget=isSentenceFill||usesNativeMathCounters?null:questionFeedback;
      clock.start({restart:true});questionStartedAt=clock.elapsedMilliseconds();
      const percentage=()=>attempts?Math.max(0,Math.round((attempts-errors)/attempts*100)):0;
      function secondsToAnswer(){const now=clock.elapsedMilliseconds(),seconds=Math.max(0,Math.round((now-questionStartedAt)/100)/10);questionStartedAt=now;return seconds}
      function escapeHtml(value){return String(value??'—').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]))}
      function capturedAnswer(){const answer=doc.querySelector('#answer');if(answer&&String(answer.value??'').trim())return String(answer.value).trim();const hour=doc.querySelector('#hourSelect'),minute=doc.querySelector('#minuteSelect');if(hour&&minute&&hour.value!==''&&minute.value!=='')return `${hour.value}:${String(minute.value).padStart(2,'0')}`;const selected=doc.querySelector('input[type="radio"]:checked,input[type="checkbox"]:checked');if(selected)return String(selected.value||selected.labels?.[0]?.textContent||'Selected').trim();const response=[...doc.querySelectorAll('textarea,input[type="text"],input[type="number"],input:not([type]),select')].find(field=>String(field.value??'').trim());return response?String(response.value).trim():'—'}
      function logAnswer(outcome){answerHistory.push({outcome,answer:capturedAnswer(),seconds:secondsToAnswer()})}
      function render(){hud.percent.textContent=unscored?'Score: Pending':`Score: ${percentage()}%`;hud.attempts.textContent=`Attempts: ${attempts}`;hud.errors.textContent=`Errors: ${errors}`}
      function toast(text,outcome='neutral'){if(!text)return;hud.feedback.textContent=text;hud.feedback.className=`beard-feedback show ${outcome}`;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>hud.feedback.className='beard-feedback',1600)}
      function record(outcome,text){if(ended||usesNativeMathCounters||outcome===undefined)return;logAnswer(outcome);attempts++;if(outcome===false)errors++;render();toast(text||(outcome?'✓ Correct':'✗ Incorrect'),outcome?'good':'bad')}
      function reset(){runId++;ended=false;attempts=0;errors=0;unscored=false;nativeCorrect=0;answerHistory=[];clock.reset();clock.start({restart:true});questionStartedAt=clock.elapsedMilliseconds();render();toast('Fresh start','neutral')}
      function decorateSummary(){const summary=[...doc.querySelectorAll('#summary,#results,.summary')].find(el=>el&&el.textContent.trim()&&win.getComputedStyle(el).display!=='none');if(!summary)return;if(!summary.querySelector('.beard-summary-meta')){const meta=doc.createElement('p');meta.className='beard-summary-meta';meta.innerHTML=`<strong>Date:</strong> ${new Date().toLocaleDateString()} &nbsp;•&nbsp; <strong>Total time:</strong> ${formatTime(clock.elapsed())}`;meta.style.cssText='margin:.8rem 0;padding:.65rem;border-radius:9px;background:#edf7fb;color:#1e4767;font-weight:800;';summary.prepend(meta)}if(!answerHistory.length||summary.querySelector('.beard-answer-history'))return;const rows=answerHistory.map((item,index)=>{const label=item.outcome===true?'Correct':item.outcome===false?'Incorrect':'Teacher check',className=item.outcome===true?'good':item.outcome===false?'bad':'pending';return `<tr><td>${index+1}</td><td class="${className}">${escapeHtml(item.answer)}</td><td class="${className}">${label}</td><td>${item.seconds.toFixed(1)} s</td></tr>`}).join('');const history=doc.createElement('section');history.className='beard-answer-history';history.innerHTML=`<h3>Answer timing</h3><table><thead><tr><th>Attempt</th><th>Student answer</th><th>Result</th><th>Seconds to answer</th></tr></thead><tbody>${rows}</tbody></table>`;summary.append(history)}
      function parseOutcome(text){const value=(text||'').toLowerCase();if(/incorrect|wrong|nope|try again|not quite/.test(value))return false;if(/correct|great job|nice job|well done|you got it/.test(value))return true;return undefined}
      function syncNativeMath(){if(!usesNativeMathCounters)return;const attemptsMatch=(nativeAttemptsEl.textContent||'').match(/\d+/),scoreMatch=(nativeScoreEl.textContent||'').match(/\d+(?:\.\d+)?\s*%/);if(!attemptsMatch)return;const nextAttempts=Number(attemptsMatch[0]),nextCorrect=scoreMatch?Math.round(nextAttempts*Number(scoreMatch[0].replace('%','').trim())/100):0,previousAttempts=attempts;if(nextAttempts<previousAttempts){answerHistory=[];questionStartedAt=clock.elapsedMilliseconds()}else if(nextAttempts>previousAttempts){const added=nextAttempts-previousAttempts;if(added===1)logAnswer(nextCorrect>nativeCorrect);else for(let index=0;index<added;index++)logAnswer(null)}attempts=nextAttempts;nativeCorrect=nextCorrect;errors=Math.max(0,attempts-nextCorrect);unscored=false;render()}
      function inspectFeedback(currentRun){feedbackQueued=false;if(ended||currentRun!==runId||!feedbackTarget)return;const text=feedbackTarget.textContent.trim(),outcome=parseOutcome(text);if(outcome!==undefined)record(outcome,text)}
      if(feedbackTarget){const feedbackObserver=new win.MutationObserver(()=>{if(feedbackQueued)return;feedbackQueued=true;const currentRun=runId;if(win.queueMicrotask)win.queueMicrotask(()=>inspectFeedback(currentRun));else win.setTimeout(()=>inspectFeedback(currentRun),0)});feedbackObserver.observe(feedbackTarget,{subtree:true,childList:true,characterData:true})}
      if(questionFeedback){const questionCueObserver=new win.MutationObserver(()=>{if(!ended&&!questionFeedback.textContent.trim())questionStartedAt=clock.elapsedMilliseconds()});questionCueObserver.observe(questionFeedback,{subtree:true,childList:true,characterData:true})}
      if(usesNativeMathCounters){let nativeQueued=false;const queueNativeSync=()=>{if(nativeQueued)return;nativeQueued=true;const currentRun=runId;const sync=()=>{nativeQueued=false;if(currentRun===runId&&!ended)syncNativeMath()};if(win.queueMicrotask)win.queueMicrotask(sync);else win.setTimeout(sync,0)};const nativeObserver=new win.MutationObserver(queueNativeSync);nativeObserver.observe(nativeAttemptsEl,{subtree:true,childList:true,characterData:true});nativeObserver.observe(nativeScoreEl,{subtree:true,childList:true,characterData:true});syncNativeMath()}
      const summaryObserver=new win.MutationObserver(decorateSummary);doc.querySelectorAll('#summary,#results,.summary').forEach(summary=>summaryObserver.observe(summary,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['style','class']}));
      const manualMarking=!feedbackTarget&&!usesNativeMathCounters&&Boolean(doc.querySelector('#btnCorrect,#teacherCorrect,#correctBtn')&&doc.querySelector('#btnIncorrect,#teacherIncorrect,#incorrectBtn'));
      const sourceScriptText=[...doc.scripts].map(script=>script.textContent).join('\n');
      const supportsKeyboardStop=/(?:e|event)\.key\s*={2,3}\s*['"]3['"][\s\S]{0,120}(?:stop|finish|end)/i.test(sourceScriptText);
      doc.addEventListener('click',event=>{const button=event.target.closest('button,input[type="button"],input[type="submit"]');if(!button)return;const text=(button.textContent||button.value||'').trim(),lower=text.toLowerCase(),handler=(button.getAttribute('onclick')||'').toLowerCase();if(/reset|play again|try again/.test(lower)){reset();return}if(/stop|finish|end/.test(lower)){ended=true;runId++;clock.stop();setTimeout(decorateSummary,100);return}if(manualMarking){let outcome;if(/incorrect|wrong/.test(lower)||/markincorrect|markanswer\(false/.test(handler))outcome=false;else if(/(^|\s)correct(\s|$)|right/.test(lower)||/markcorrect|markanswer\(true/.test(handler))outcome=true;if(outcome!==undefined){record(outcome,outcome?'✓ Correct':'✗ Incorrect');return}}if(isSentenceFill&&/next/.test(lower)){const response=doc.querySelector('textarea,input[type="text"],input:not([type])');if(response&&response.value.trim()){logAnswer(null);attempts++;unscored=true;render();toast('Response saved — teacher check pending','neutral')}}},true);
      doc.addEventListener('keydown',event=>{if(event.repeat||event.target.matches('input,textarea,select,[contenteditable="true"]'))return;if(event.key==='3'&&supportsKeyboardStop){ended=true;runId++;clock.stop();setTimeout(decorateSummary,100);return}if(!manualMarking)return;if(event.key==='1'){record(true,'✓ Correct')}else if(event.key==='2'){record(false,'✗ Incorrect')}},true);
      render();
    }

    function enhanceFluency(doc,win,hud,clock){
      const passage=doc.querySelector('#passage'),colorSelect=doc.querySelector('#colorSelect'),studentSelect=doc.querySelector('#studentSelect'),counter=doc.querySelector('#counter');
      const colors=['red','green','blue','purple','pink'],names={red:'Monday',green:'Tuesday',blue:'Wednesday',purple:'Thursday',pink:'Friday'};
      const hint=doc.createElement('p');hint.className='beard-fluency-hint';hint.innerHTML='<strong>Quick fluency tools:</strong> click the last word read, then click that same word again to undo it. Right-click a word to toggle an error; press <strong>2</strong> to mark the selected word as an error. Use Start Timer to begin the one-minute countdown.';(doc.querySelector('#rightColumn')||passage.parentElement).prepend(hint);
      const errorsByStudent=new Map(),elapsedByStudent=new Map();let activeWord=null,feedbackTimer;
      function studentKey(){return studentSelect.value||'__current_read__'}
      function recordFor(store,key){if(!store.has(key))store.set(key,{red:new Set(),green:new Set(),blue:new Set(),purple:new Set(),pink:new Set()});return store.get(key)}
      function marks(){return [...passage.querySelectorAll('.word')]}
      function wordColor(word){const value=(word.style.backgroundColor||'').toLowerCase().replaceAll(' ','');return {'rgb(255,0,0)':'red','rgb(0,128,0)':'green','rgb(0,0,255)':'blue','rgb(128,0,128)':'purple','rgb(255,192,203)':'pink'}[value]||value}
      function statsFor(color){const last=Math.max(0,...marks().filter(w=>wordColor(w)===color).map(w=>Number(w.dataset.index)+1));const errors=[...recordFor(errorsByStudent,studentKey())[color]].filter(index=>index<last).length;const correct=Math.max(0,last-errors);const accuracy=last?Math.round(correct/last*100):0;const saved=recordFor(elapsedByStudent,studentKey())[color];const seconds=saved||clock.elapsed()||60;const wcpm=correct?Math.round(correct/Math.max(1,seconds)*60):0;return{last,errors,correct,accuracy,wcpm,seconds}}
      function applyErrors(){const selected=recordFor(errorsByStudent,studentKey()),currentColor=colorSelect.value,last=statsFor(currentColor).last;marks().forEach(word=>{word.classList.remove('beard-error-word','beard-selected-word');if(selected[currentColor].has(Number(word.dataset.index))&&Number(word.dataset.index)<last)word.classList.add('beard-error-word')});if(activeWord&&passage.contains(activeWord))activeWord.classList.add('beard-selected-word')}
      function refresh(){applyErrors();const selectedColor=colorSelect.value,now=statsFor(selectedColor);hud.percent.textContent=now.last?`Accuracy: ${now.accuracy}%`:'Accuracy: —';hud.errors.textContent=`Errors: ${now.errors}`;if(counter&&now.last)counter.textContent=`Words read: ${now.last} • Words correct: ${now.correct} • ${now.wcpm} WCPM`;colors.forEach(color=>{const box=doc.getElementById(`${color==='red'?'monday':color==='green'?'tuesday':color==='blue'?'wednesday':color==='purple'?'thursday':'friday'}Box`);if(!box)return;const item=statsFor(color);box.textContent=item.last?`${names[color]}: ${item.wcpm} WCPM • ${item.accuracy}% accuracy • ${item.errors} error${item.errors===1?'':'s'}`:`${names[color]}: 0`})}
      function toast(text,type='neutral'){hud.feedback.textContent=text;hud.feedback.className=`beard-feedback show ${type}`;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>hud.feedback.className='beard-feedback',1600)}
      function setError(word,{toggle=false}={}){if(!word)return;const color=colorSelect.value,set=recordFor(errorsByStudent,studentKey())[color],index=Number(word.dataset.index);if(toggle&&set.has(index)){set.delete(index);toast('Error mark removed','neutral')}else{set.add(index);toast(`Error marked on word ${index+1}`,'bad')}activeWord=word;refresh()}
      function clearCurrent(){const key=studentKey();errorsByStudent.delete(key);elapsedByStudent.delete(key);activeWord=null;refresh()}
      function finish(){clock.stop();const item=statsFor(colorSelect.value),modal=doc.createElement('section');modal.className='beard-fluency-summary';modal.innerHTML=`<div class="beard-fluency-summary-card"><h2>Fluency Read Summary</h2><p><strong>${studentSelect.value||'Student'} • ${names[colorSelect.value]} • ${new Date().toLocaleDateString()}</strong></p><div class="beard-summary-grid"><div><b>Total time</b>${formatTime(clock.elapsed())}</div><div><b>Last word mark</b>${item.last}</div><div><b>Words correct</b>${item.correct}</div><div><b>Errors</b>${item.errors}</div><div><b>Accuracy</b>${item.last?item.accuracy+'%':'—'}</div><div><b>Rate</b>${item.last?item.wcpm+' WCPM':'—'}</div></div><div class="beard-summary-actions"><button type="button" data-print>Print</button><button type="button" data-close>Close</button></div></div>`;modal.querySelector('[data-print]').addEventListener('click',()=>win.print());modal.querySelector('[data-close]').addEventListener('click',()=>modal.remove());doc.body.append(modal)}
      const finishButton=doc.createElement('button');finishButton.type='button';finishButton.id='beard-finish-read';finishButton.className='beard-chip beard-bottom-right';finishButton.textContent='Finish read';finishButton.style.cursor='pointer';finishButton.addEventListener('click',finish);doc.body.append(finishButton);
      passage.addEventListener('click',event=>{const word=event.target.closest('.word');if(!word)return;const selectedColor=colorSelect.value;setTimeout(()=>{activeWord=wordColor(word)===selectedColor?word:null;refresh()},0)},true);
      passage.addEventListener('contextmenu',event=>{const word=event.target.closest('.word');if(!word)return;event.preventDefault();setError(word,{toggle:true})},true);
      colorSelect.addEventListener('change',()=>setTimeout(refresh,0));studentSelect.addEventListener('change',()=>{activeWord=null;setTimeout(refresh,0)});
      doc.addEventListener('keydown',event=>{if(event.key==='2'){event.preventDefault();event.stopImmediatePropagation();setError(activeWord)}else if(event.key==='1'){event.preventDefault();event.stopImmediatePropagation();clock.start({restart:true});toast('One-minute read started','neutral')}else if(event.key==='3'){event.preventDefault();event.stopImmediatePropagation();clock.reset();refresh();toast('Timer reset to 1:00','neutral')}else if(event.key==='4'){event.preventDefault();event.stopImmediatePropagation();clearCurrent();clock.reset();win.resetPassage?.();setTimeout(()=>{clock.render();refresh()},0)}else if(event.key==='5'){event.preventDefault();event.stopImmediatePropagation();errorsByStudent.clear();elapsedByStudent.clear();activeWord=null;clock.reset();win.resetAll?.();setTimeout(()=>{clock.render();refresh()},0)}},{capture:true});
      doc.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.id==='beard-finish-read')return;const lower=(button.textContent||'').toLowerCase();if(/start timer/.test(lower)){event.preventDefault();event.stopImmediatePropagation();clock.start({restart:true});toast('One-minute read started','neutral')}else if(/stop timer/.test(lower)){event.preventDefault();event.stopImmediatePropagation();const color=colorSelect.value;recordFor(elapsedByStudent,studentKey())[color]=clock.elapsed();finish()}else if(/reset passage/.test(lower)){clearCurrent();clock.reset();setTimeout(()=>{clock.render();refresh()},0)}else if(/reset all/.test(lower)){errorsByStudent.clear();elapsedByStudent.clear();activeWord=null;clock.reset();setTimeout(()=>{clock.render();refresh()},0)}else if(/^add$/.test(lower)){setTimeout(refresh,0)}},{capture:true});
      refresh();
    }

    function wireInternalLinks(doc,frame,sourceUrl){doc.addEventListener('click',event=>{const link=event.target.closest('a[href]');if(!link)return;const url=new URL(link.href,sourceUrl);if(url.origin===location.origin&&/\.html(?:\.html)?$/i.test(url.pathname)&&!link.target){event.preventDefault();frame.src=url.href}},true)}
    function formatTime(seconds){return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
  </script>
</body>
