<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beard's Classroom Activity</title>
  <style>
    :root{--navy:#1e4767;--blue:#2878a9;--cream:#fffdf7;--line:#d4e2ea}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef8fd;font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;color:#273b4c}.launcher-header{height:64px;display:flex;align-items:center;gap:1rem;padding:.7rem 1rem;background:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(15,49,77,.22);position:relative;z-index:2}.home-link{color:#fff;text-decoration:none;font-weight:800;padding:.5rem .7rem;border:1px solid rgba(255,255,255,.45);border-radius:8px;white-space:nowrap}.home-link:hover,.home-link:focus{background:rgba(255,255,255,.15);outline:none}.activity-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"Comic Sans MS","Chalkboard SE",sans-serif;font-size:1.1rem}.direct-link{margin-left:auto;color:#d8f3ff;font-size:.85rem;white-space:nowrap}.frame{display:block;border:0;width:100%;height:calc(100vh - 64px);background:#eff9ff}.error{max-width:600px;margin:4rem auto;background:#fff;padding:2rem;border-radius:18px;box-shadow:0 8px 24px rgba(30,71,103,.12);line-height:1.5}.error a{color:#1d6495;font-weight:800}@media(max-width:600px){.launcher-header{gap:.55rem;padding:.6rem}.activity-name{font-size:.9rem}.direct-link{display:none}.frame{height:calc(100vh - 58px)}}
  </style>
</head>
<body>
  <header class="launcher-header"><a class="home-link" href="../index.html">← Home</a><strong class="activity-name" id="activity-name">Opening activity…</strong><a class="direct-link" id="direct-link" target="_blank" rel="noopener">Open directly ↗</a></header>
  <main id="main"></main>
  <script>
    const main=document.querySelector('#main'),title=document.querySelector('#activity-name'),direct=document.querySelector('#direct-link');
    const requested=new URLSearchParams(location.search).get('activity')||'';
    const valid=requested.startsWith('HTMLs/')&&!requested.includes('..')&&/\.html(?:\.html)?$/i.test(requested);
    if(!valid){main.innerHTML='<section class="error"><h1>Activity not found</h1><p>Please return to Beard\'s Classroom and choose an activity from the menu.</p><p><a href="../index.html">Return home</a></p></section>';title.textContent='Choose an activity';direct.remove();}else{const frame=document.createElement('iframe');frame.className='frame';frame.title='Beard\'s Classroom activity';const source=new URL('../'+requested,location.href);frame.src=source.href;direct.href=source.href;title.textContent=decodeURIComponent(requested.split('/').pop().replace(/\.html(?:\.html)?$/i,'').replaceAll('_',' '));main.append(frame);frame.addEventListener('load',()=>enhance(frame));}
    function enhance(frame){let doc;try{doc=frame.contentDocument}catch{return}if(!doc||doc.getElementById('beard-shell-style'))return;const sourceUrl=frame.contentWindow.location.href;direct.href=sourceUrl;const pageName=doc.title||decodeURIComponent(sourceUrl.split('/').pop().replace(/\.html(?:\.html)?$/i,'').replaceAll('_',' '));title.textContent=pageName;
      const style=doc.createElement('style');style.id='beard-shell-style';style.textContent=`
        :root{--beard-navy:#1e4767;--beard-blue:#2878a9;--beard-sky:#e9f7ff;--beard-cream:#fffdf7;--beard-line:#d3e4ed;--beard-green:#238451;--beard-red:#c84545}html,body{min-height:100%!important}body{background:linear-gradient(135deg,#e8f6ff,#fff9e9)!important;color:#26394b!important;padding-top:78px!important;padding-bottom:24px!important;font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif!important}h1,h2,h3{color:var(--beard-navy)!important}button{background:var(--beard-blue)!important;color:#fff!important;border:0!important;border-radius:10px!important;padding:.65rem 1rem!important;font-weight:800!important;box-shadow:0 3px 0 rgba(20,73,111,.18)!important;transition:transform .12s ease,filter .12s ease!important}button:hover,button:focus{filter:brightness(.94)!important;transform:translateY(-1px)!important;outline:3px solid #a7def8!important;outline-offset:2px!important}button.danger,.reset,#reset,.btn-red{background:#c85b56!important}input,select,textarea{border:2px solid var(--beard-line)!important;border-radius:9px!important;background:#fff!important;color:#26394b!important}#score,#attempts,#timer{position:fixed!important;top:14px!important;bottom:auto!important;z-index:9999!important;display:block!important;background:rgba(255,253,247,.98)!important;color:var(--beard-navy)!important;padding:.55rem .75rem!important;border:2px solid #fff!important;border-radius:11px!important;box-shadow:0 4px 12px rgba(30,71,103,.14)!important;font-size:1rem!important;font-weight:850!important}#timer{left:14px!important}#score{right:14px!important}#attempts{right:132px!important}#feedback,#result{min-height:2.6rem!important;margin-top:.85rem!important;padding:.65rem .85rem!important;border-radius:10px!important;background:rgba(255,255,255,.72)!important;font-size:1.12rem!important;font-weight:850!important;text-align:center!important}#summary{border:3px solid #fff!important;box-shadow:0 8px 24px rgba(30,71,103,.15)!important}#beard-live-stats{position:fixed;z-index:9998;top:14px;right:14px;display:flex;gap:.45rem;align-items:center;max-width:calc(100vw - 150px);font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif}#beard-live-stats span{background:rgba(255,253,247,.98);border:2px solid #fff;box-shadow:0 4px 12px rgba(30,71,103,.14);border-radius:11px;padding:.55rem .7rem;color:var(--beard-navy);font-weight:850;font-size:.95rem;white-space:nowrap}#beard-live-stats .beard-response{max-width:260px;overflow:hidden;text-overflow:ellipsis}#beard-live-stats .beard-response.good{color:var(--beard-green)}#beard-live-stats .beard-response.bad{color:var(--beard-red)}@media(max-width:620px){body{padding-top:118px!important}#score{right:12px!important}#attempts{right:12px!important;top:58px!important}#beard-live-stats{top:58px;right:12px;left:12px;justify-content:flex-end}#beard-live-stats .beard-response{display:none}}
      `;doc.head.append(style);
      const needsLiveStats=!(doc.getElementById('score')&&doc.getElementById('attempts'));
      let attempts=0,correct=0,lastOutcome=0,sessionStart=Date.now(),stopped=false,stats;
      if(needsLiveStats){stats=doc.createElement('aside');stats.id='beard-live-stats';stats.setAttribute('aria-live','polite');stats.innerHTML='<span class="beard-percent">Score: 0%</span><span class="beard-attempts">Attempts: 0</span><span class="beard-response">Response: —</span>';doc.body.append(stats);}
      function render(){if(!stats)return;stats.querySelector('.beard-percent').textContent=`Score: ${attempts?Math.round(correct/attempts*100):0}%`;stats.querySelector('.beard-attempts').textContent=`Attempts: ${attempts}`;}
      function status(text,outcome){if(!text)return;const now=Date.now();if(outcome!==undefined&&now-lastOutcome>375){attempts++;if(outcome)correct++;lastOutcome=now;render()}if(stats){const el=stats.querySelector('.beard-response');el.textContent='Response: '+text;el.className='beard-response '+(outcome===true?'good':outcome===false?'bad':'');}}
      function parseOutcome(text){const value=(text||'').toLowerCase();if(/incorrect|wrong|nope|try again|not quite/.test(value))return false;if(/correct|great job|nice job|well done|you got it/.test(value))return true;return undefined;}
      function resetStats(){attempts=0;correct=0;sessionStart=Date.now();stopped=false;lastOutcome=0;render();if(stats){const el=stats.querySelector('.beard-response');el.textContent='Response: —';el.className='beard-response';}}
      doc.addEventListener('click',event=>{const link=event.target.closest('a[href]');if(link){const url=new URL(link.href,sourceUrl);if(url.origin===location.origin&&/\.html(?:\.html)?$/i.test(url.pathname)&&!link.target){event.preventDefault();frame.src=url.href;return;}}const button=event.target.closest('button,input[type="button"],input[type="submit"]');if(!button)return;const text=(button.textContent||button.value||'').trim();const lower=text.toLowerCase(),handler=(button.getAttribute('onclick')||'').toLowerCase();if(/reset|play again|try again/.test(lower)){resetStats();return}if(/stop|finish|end/.test(lower)){stopped=true}let outcome;if(/incorrect|wrong/.test(lower)||/markincorrect|markanswer\(false/.test(handler))outcome=false;else if(/(^|\s)correct(\s|$)|right/.test(lower)||/markcorrect|markanswer\(true/.test(handler))outcome=true;if(outcome!==undefined)status(outcome?'✓ Correct':'✗ Incorrect',outcome);else setTimeout(()=>{const feedback=doc.querySelector('#feedback,#result,[role="status"]');if(feedback){const msg=feedback.textContent.trim(),result=parseOutcome(msg);if(result!==undefined)status(msg,result)}},25);},true);
      const observer=new doc.defaultView.MutationObserver(()=>{const feedback=doc.querySelector('#feedback,#result,[role="status"]');if(!feedback)return;const text=feedback.textContent.trim(),outcome=parseOutcome(text);if(outcome!==undefined)status(text,outcome);});observer.observe(doc.body,{subtree:true,childList:true,characterData:true});
    }
  </script>
</body>
</html>
