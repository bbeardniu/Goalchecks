<!doctype html>
<html lang="en" class="beard-phonics-root"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Common Vowel Teams Goal Check</title>
<style>
:root{--navy:#1e4767;--ink:#26394b;--line:#ccdfdf;--green:#237f4e;--red:#bd4141}*{box-sizing:border-box}body{margin:0;padding:1.25rem;background:#edf6f1;color:var(--ink);font:17px/1.5 "Segoe UI",Arial,sans-serif}.shell{max-width:800px;margin:auto;padding:clamp(1rem,3vw,2rem);border:3px solid white;border-radius:22px;background:#fffdf7;box-shadow:0 10px 30px #274c3d12}h1,h2{color:var(--navy);line-height:1.2}h1{font-family:"Comic Sans MS","Chalkboard SE",cursive}.settings,.controls,.teacher-buttons{display:flex;align-items:center;justify-content:center;gap:.7rem;flex-wrap:wrap}label{font-weight:800}select,button{font:inherit;min-height:46px;padding:.65rem .85rem;border-radius:10px}select{background:white;border:2px solid var(--line);max-width:100%}button{border:0;background:#2878a9;color:#fff;font-weight:800;cursor:pointer}.teacher-buttons button{flex:1;min-width:130px}.teacher-btn.correct{background:var(--green)}.teacher-btn.incorrect{background:var(--red)}#word{font:800 clamp(3rem,14vw,5.5rem)/1.2 "Segoe UI",Arial,sans-serif;text-align:center;padding:2.1rem .5rem;margin:1rem 0;border:2px dashed #bdcfb8;border-radius:18px;background:#f5f8ed;overflow-wrap:anywhere}#feedback{text-align:center;font-weight:850;min-height:1.5em}#progress,#timer{text-align:center;color:#526e76;font-weight:750}.good{color:var(--green)}.bad{color:var(--red)}#summary{display:none;padding:1rem;margin-top:1rem;border:2px solid var(--line);border-radius:14px}.responses{display:flex;flex-wrap:wrap;gap:.5rem}.responses span{padding:.4rem .6rem;border:1px solid var(--line);border-radius:8px}.hint{font-size:.9rem;color:#536d74}.controls{margin-top:1rem}[hidden]{display:none!important}@media(max-width:560px){body{padding:.65rem}.settings{display:grid;text-align:center}select{width:100%}.teacher-buttons{position:static!important;width:auto!important}.teacher-buttons button{margin:0!important;min-width:0}}@media print{.settings,.hint,#workArea,.controls,#timer{display:none!important}}
</style><link rel="stylesheet" href="../../assets/css/phonics-layout.css?v=01.0009">
<script defer src="../../assets/js/phonics-layout.js?v=01.0009"></script>
</head><body class="beard-phonics-page"><main class="shell"><h1>Common Vowel Teams</h1><p>Read each word aloud. Choose one spelling pattern or a balanced mixed check.</p><div class="settings"><label for="patternSelect">Step</label><select id="patternSelect"><option value="ai-ay">Long a · ai / ay</option><option value="ee-ea">Long e · ee / ea</option><option value="oa-ow">Long o · oa / ow</option><option value="oo">Two oo sounds</option><option value="ew-ue">Long u · ew / ue</option><option value="mixed">Mixed vowel teams</option></select></div><p class="hint" id="patternHint"></p><section id="workArea"><div id="word" data-beard-prompt aria-live="polite">Ready to read?</div><p id="progress"></p><div class="teacher-buttons"><button type="button" id="btnIncorrect" class="teacher-btn incorrect" disabled>Incorrect · 2</button><button type="button" id="btnCorrect" class="teacher-btn correct" disabled>Correct · 1</button></div></section><p id="feedback" aria-live="polite"></p><div class="controls"><button type="button" id="startBtn">Start check</button><button type="button" id="stopBtn" disabled>Stop assessment</button><button type="button" id="resetBtn">Reset check</button></div><p id="timer">Time: 0s</p><section id="summary" aria-live="polite"></section></main>
<script>
(() => {
 'use strict';
 const banks={
  'ai-ay':{label:'Long a · ai / ay',hint:'Expected vowel sound: long a. The mixed list balances ai and ay words.',groups:[['rain','pain','pail','nail','mail','sail','tail','rail','fail','wait','bait','main','gain','laid','paid','raid','aim','chain','train','paint'],['day','bay','hay','lay','may','pay','ray','say','way','play','stay','tray','gray','clay','pray','sway','spray','stray','delay','today']]},
  'ee-ea':{label:'Long e · ee / ea',hint:'The ea words in this step use long e; short-e exceptions are not mixed into this check.',groups:[['bee','see','fee','tee','tree','free','flee','feed','need','seed','weed','feel','heel','peel','keep','deep','sleep','green','sheep','three'],['beach','bead','beak','beam','bean','beat','each','eat','east','feat','heat','leaf','lean','leap','meal','mean','neat','peach','seat','team']]},
  'oa-ow':{label:'Long o · oa / ow',hint:'The ow words in this step use long o, as in snow. Ow /ou/ words are checked under Other Vowel Patterns.',groups:[['boat','coat','goat','moat','oat','road','load','toad','soap','soak','coal','goal','foal','loaf','loan','foam','roam','oak','float','toast'],['bow','low','mow','row','sow','tow','flow','glow','grow','show','slow','snow','blow','crow','know','throw','grown','shown','blown','thrown']]},
  'oo':{label:'Two oo sounds',hint:'The adult scores the vowel in the whole word. This step deliberately includes both oo as in moon and oo as in book.',groups:[['moon','soon','noon','food','mood','pool','cool','tool','fool','room','boom','boot','hoot','loop','roof','root','spoon','broom','bloom','school'],['book','cook','hook','look','took','nook','rook','good','wood','hood','foot','soot','wool','brook','crook','stood','shook','cooked','looked','hooked']]},
  'ew-ue':{label:'Long u · ew / ue',hint:'Accept the taught long-u pronunciation, including regional /yoo/ or /oo/ variants. Non-long-u exceptions such as sew are excluded.',groups:[['new','dew','few','hew','mew','pew','blew','chew','crew','drew','flew','grew','stew','brew','skew','slew','spew','threw','shrew','renew'],['blue','clue','flue','glue','true','cue','due','hue','sue','rue','value','rescue','argue','issue','tissue','pursue','statue','avenue','barbecue','continue']]}
 };
 // Every item is real-word reading. Uncued homographs whose vowel changes with meaning are excluded.
 banks['oa-ow'].groups[1]=banks['oa-ow'].groups[1].filter(word=>!['bow','row','sow'].includes(word));
 const $=s=>document.querySelector(s),select=$('#patternSelect'),word=$('#word'),feedback=$('#feedback'),summary=$('#summary'),work=$('#workArea');
 let items=[],index=0,history=[],active=false,locked=false,nextTimeout=null,timerInterval=null,startedAt=0,questionStartedAt=0,seconds=0;
 const random=()=>window.BeardRun?.random?.()??Math.random();
 function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
 function label(){return select.value==='mixed'?'Common vowel teams · balanced mixed':banks[select.value].label;}
 function sync(){document.body.dataset.beardRunAware='true';document.body.dataset.beardLevel=label();document.body.dataset.beardSkill='Vowel-team word reading';$('#patternHint').textContent=select.value==='mixed'?'A balanced rotation through the five vowel-team groups. The longer long-u words add syllable demands; keep the selected step consistent across weekly checks.':banks[select.value].hint;}
 function build(){const groups=select.value==='mixed'?Object.values(banks).map(bank=>shuffle(bank.groups.flat())):banks[select.value].groups.map(shuffle);const result=[];while(groups.some(g=>g.length))for(const group of groups)if(group.length)result.push(group.pop());return result;}
 function elapsed(){return active?Math.max(0,(Date.now()-startedAt)/1000):seconds;}
 function state(){const correct=history.filter(h=>h.correct).length;return{assessment:document.title,level:label(),attempts:history.length,correct,errors:history.length-correct,seconds:elapsed(),responses:history.slice(),active};}
 function controls(){for(const id of ['btnCorrect','btnIncorrect'])$('#'+id).disabled=!active||locked;$('#stopBtn').disabled=!active;select.disabled=false;}
 function clearTimers(){clearTimeout(nextTimeout);nextTimeout=null;clearInterval(timerInterval);timerInterval=null;}
 function show(){if(index>=items.length){stop();return;}locked=false;word.textContent=items[index];questionStartedAt=Date.now();feedback.textContent='';feedback.className='';$('#progress').textContent='Word '+(index+1)+' of '+items.length;controls();}
 function start(){clearTimers();sync();items=build();history=[];index=0;seconds=0;startedAt=Date.now();active=true;locked=false;summary.style.display='none';summary.replaceChildren();work.hidden=false;timerInterval=setInterval(()=>$('#timer').textContent='Time: '+Math.floor(elapsed())+'s',1000);show();}
 function mark(correct){if(!active||locked||!items[index])return;locked=true;history.push({word:items[index],prompt:items[index],answer:items[index],correct,seconds:Math.max(0,(Date.now()-questionStartedAt)/1000),elapsedSeconds:elapsed()});feedback.textContent=correct?'Correct!':'Incorrect.';feedback.className=correct?'good':'bad';controls();nextTimeout=setTimeout(()=>{if(!active)return;index++;show();},350);}
 function stop(){if(!active)return;seconds=elapsed();active=false;locked=true;clearTimers();controls();work.hidden=true;const result=state();summary.innerHTML='<h2>Vowel Team Results</h2><p><strong>'+label()+'</strong></p><p>Date: '+new Date().toLocaleDateString()+' · Correct: '+result.correct+'/'+result.attempts+' · Score: '+(result.attempts?Math.round(result.correct/result.attempts*100):0)+'% · Total time: '+Math.floor(seconds)+'s</p><div class="responses">'+history.map(h=>'<span class="'+(h.correct?'good':'bad')+'">'+h.word+'</span>').join('')+'</div><button type="button" id="playAgain">Play again</button>';summary.style.display='block';$('#playAgain').addEventListener('click',start);document.dispatchEvent(new CustomEvent('beard:assessment-stop',{detail:{state:result}}));}
 function ready(){clearTimers();active=false;locked=false;history=[];seconds=0;sync();controls();work.hidden=false;word.textContent='Ready to read?';$('#progress').textContent='Choose a step and press Start.';feedback.textContent='';summary.style.display='none';$('#timer').textContent='Time: 0s';}
 $('#startBtn').addEventListener('click',start);$('#resetBtn').addEventListener('click',ready);$('#stopBtn').addEventListener('click',stop);$('#btnCorrect').addEventListener('click',()=>mark(true));$('#btnIncorrect').addEventListener('click',()=>mark(false));select.addEventListener('change',()=>{ready();document.dispatchEvent(new CustomEvent('beard:settings-changed',{detail:{level:label(),skill:document.title}}));});document.addEventListener('beard:run-start',start);document.addEventListener('keydown',event=>{if(event.repeat||event.target.matches('input,textarea,select,[contenteditable="true"]'))return;if(event.key==='1'){event.preventDefault();mark(true);}else if(event.key==='2'){event.preventDefault();mark(false);}else if(event.key==='3'){event.preventDefault();stop();}});window.BeardAssessment={start,reset:ready,stop,getState:state};window.BeardVowelTeamBanks=banks;ready();
})();
</script></body></html>
