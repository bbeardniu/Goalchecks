<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our School of Fish</title>

<style>
body {
    margin: 0;
    font-family: "Comic Sans MS", "Arial Rounded MT Bold", Arial, sans-serif;
    background: linear-gradient(#7dd3fc, #0ea5e9);
    overflow-x: hidden;
}

* { box-sizing: border-box; }
.sea-art {
    display: inline-block;
    width: var(--art-size, 80px);
    height: var(--art-size, 80px);
    background-image: url('../assets/illustrations/storybook-tools.webp');
    background-size: 400% 400%;
    background-repeat: no-repeat;
    vertical-align: middle;
}
h1 .sea-art { --art-size: 64px; }

h1 {
    text-align: center;
    color: white;
    font-size: 42px;
    margin: 10px 0;
    text-shadow: 2px 2px #0369a1;
}

/* Controls */
.controls {
    background: white;
    padding: 15px;
    border-radius: 20px;
    max-width: 1400px;
    margin: 0 auto 10px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    text-align: center;
}

.controls select, .controls input, .controls button {
    font-size: 16px;
    padding: 6px 10px;
    border-radius: 14px;
    margin: 4px;
    border: 2px solid #38bdf8;
}
.controls input { max-width: 100px; }
.controls label { display: inline-block; margin: 3px; }

/* Ocean */
.ocean {
    position: relative;
    width: 100%;
    max-width: 1400px;
    height: 650px; /* increased height */
    margin: 0 auto;
    background: linear-gradient(to bottom, #38bdf8, #0284c7, #0369a1);
    border-radius: 30px;
    overflow: hidden;
    border: 6px solid #0c4a6e;
}

/* Bubbles */
.bubble {
    position: absolute;
    bottom: -40px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    animation: rise 10s infinite ease-in;
}

@keyframes rise {
    0% { transform: translateY(0); opacity: 0.8; }
    100% { transform: translateY(-700px); opacity: 0; }
}

/* Kelp */
.kelp {
    position: absolute;
    bottom: 100px;
    --art-size: 150px;
    animation: sway 4s ease-in-out infinite;
}

.kelp::after {
    content: none;
    position: absolute;
    width: 60px; /* wider leaf */
    height: 120px; /* taller leaf */
    background: linear-gradient(#22c55e, #15803d);
    border-radius: 50%;
    top: -60px; /* adjust to top of kelp */
    left: -20px;
}

@keyframes sway {
    0%,100% { transform: rotate(-2deg); }
    50% { transform: rotate(3deg); }
}

.k25 { left: 25%; }
.k50 { left: 50%; }
.k75 { left: 75%; }

/* Fish */
.fish {
    position: absolute;
    --art-size: 76px;
}

/* Treasure */
.treasure {
    position: absolute;
    right: 40px; /* moved slightly left */
    bottom: 160px; /* moved above sea floor */
    --art-size: 128px;
    transition: transform 0.5s;
}

.gold {
    position: absolute;
    right: 35px;
    bottom: 250px; /* adjusted for taller treasure */
    --art-size: 52px;
    display: none;
}

/* Fireworks */
.firework {
    position: absolute;
    --art-size: 35px;
    animation: pop 1s ease-out forwards;
}

@keyframes pop {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
}

/* Sea floor decorations */
.seafloor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 150px; /* enough for bigger icons */
    background: #fde68a;
    border-top: 6px solid #f59e0b;
    display: flex;
    justify-content: space-around; /* more space between icons */
    align-items: center;
    padding: 0 30px; /* more padding */
}
.seafloor .sea-art { --art-size: clamp(52px, 12vw, 118px); flex-shrink: 0; }
@media(max-width:600px) {
    h1 { font-size: 1.8rem; }
    h1 .sea-art { --art-size: 44px; }
    .controls { margin: 0 .5rem .7rem; padding: .65rem; }
    .controls select, .controls input, .controls button { min-height: 44px; max-width: 100%; }
    .ocean { width: calc(100% - 1rem); border-radius: 20px; }
    .seafloor { padding: 0 .5rem; }
    .treasure { right: 10px; --art-size: 100px; }
    .gold { right: 15px; }
    .kelp { --art-size: 105px; }
}
@media(prefers-reduced-motion:reduce) { .bubble,.kelp,.firework { animation: none; } }
</style>
</head>

<body>

<h1><span class="sea-art" data-art="1" aria-hidden="true"></span> Our School of Fish <span class="sea-art" data-art="0" aria-hidden="true"></span></h1>

<div class="controls">
    <label for="grade">Grade:</label>
    <select id="grade" onchange="updateFish()">
        <option value="2">2nd Grade</option>
        <option value="3">3rd Grade</option>
    </select>

    <label for="season">Season:</label>
    <select id="season" onchange="updateFish()">
        <option value="fall">Fall</option>
        <option value="winter">Winter</option>
        <option value="spring">Spring</option>
    </select>

    <label for="fishType">Sea creature:</label>
    <select id="fishType">
        <option value="fish">Blue fish</option>
        <option value="tropical">Tropical fish</option>
        <option value="pufferfish">Pufferfish</option>
        <option value="shark">Shark</option>
        <option value="dolphin">Dolphin</option>
        <option value="squid">Squid</option>
        <option value="crab">Crab</option>
        <option value="octopus">Octopus</option>
        <option value="shrimp">Shrimp</option>
        <option value="coral">Coral</option>
    </select>

    <label for="score">Score:</label>
    <input type="number" id="score" min="0">

    <button onclick="addFish()">Add Fish</button>
    <button onclick="resetOcean()">Reset</button>
</div>

<div class="ocean" id="ocean">
    <div class="kelp k25 sea-art" data-art="9" aria-hidden="true"></div>
    <div class="kelp k50 sea-art" data-art="9" aria-hidden="true"></div>
    <div class="kelp k75 sea-art" data-art="9" aria-hidden="true"></div>

    <div class="treasure sea-art" id="treasure" data-art="10" role="img" aria-label="A closed treasure chest"></div>
    <div class="gold sea-art" id="gold" data-art="15" aria-hidden="true"></div>

    <div class="seafloor" aria-hidden="true">
        <span class="sea-art" data-art="12"></span><span class="sea-art" data-art="13"></span><span class="sea-art" data-art="15"></span><span class="sea-art" data-art="9"></span><span class="sea-art" data-art="12"></span>
    </div>
</div>

<script>
const benchmarks = {
    2: { fall: 56, winter: 84, spring: 101 },
    3: { fall: 87, winter: 110, spring: 125 }
};

const ocean = document.getElementById("ocean");
const gold = document.getElementById("gold");
const grade = document.getElementById("grade");
const season = document.getElementById("season");
const fishType = document.getElementById("fishType");
const creatureArt = {fish:0,tropical:1,pufferfish:2,shark:3,dolphin:4,squid:5,crab:6,octopus:7,shrimp:8,coral:9};
let fishList = [];

function setArt(element, index) {
    element.style.backgroundPosition = (index % 4 / 3 * 100) + '% ' + (Math.floor(index / 4) / 3 * 100) + '%';
}
document.querySelectorAll('[data-art]').forEach(element => setArt(element, Number(element.dataset.art)));

// Create bubbles
for (let i = 0; i < 30; i++) {
    const b = document.createElement("div");
    b.className = "bubble";
    b.style.left = Math.random() * 100 + "%";
    b.style.animationDuration = 5 + Math.random() * 5 + "s";
    ocean.appendChild(b);
}

function goal() {
    return benchmarks[grade.value][season.value];
}

function addFish() {
    const score = Number(document.getElementById("score").value);
    if (!score) return;

    const fish = document.createElement("div");
    fish.className = "fish sea-art";
    setArt(fish, creatureArt[fishType.value]);
    fish.setAttribute('role', 'img');
    fish.setAttribute('aria-label', fishType.selectedOptions[0].textContent + ', reading score ' + score);
    const lane = 70 + fishList.length * 45;
    fish.style.top = lane + "px";
    fish.style.left = "10px";

    ocean.appendChild(fish);
    fishList.push({ fish, score });
    swimFish(fish, score, lane);
}

function swimFish(fish, score, lane) {
    const percent = Math.min(score / goal(), 1);
    const maxX = Math.max(0, ocean.clientWidth - 100);

    let start = performance.now();
    let duration = 1500;

    function animate(time) {
        let elapsed = time - start;
        let progress = Math.min(elapsed / duration, 1);
        let x = 10 + progress * percent * maxX;
        let y = lane + Math.sin(progress * Math.PI * 2) * 8;
        fish.style.left = x + "px";
        fish.style.top = y + "px";
        if (progress < 1) requestAnimationFrame(animate);
        else if (percent === 1) celebrate(fish);
    }
    requestAnimationFrame(animate);
}

function celebrate(fish) {
    gold.style.display = "block";
    const treasure = document.getElementById("treasure");
    setArt(treasure, 11);
    treasure.setAttribute('aria-label', 'An open treasure chest full of gold');

    for (let i = 0; i < 5; i++) {
        const f = document.createElement("div");
        f.className = "firework sea-art";
        setArt(f, 15);
        f.setAttribute('aria-hidden', 'true');
        f.style.left = fish.offsetLeft + (Math.random()*40-20) + "px";
        f.style.top = fish.offsetTop + (Math.random()*20-10) + "px";
        ocean.appendChild(f);
        setTimeout(() => f.remove(), 1000);
    }
}

function updateFish() {
    fishList.forEach(f => swimFish(f.fish, f.score, parseFloat(f.fish.style.top)));
}

function resetOcean() {
    fishList.forEach(f => f.fish.remove());
    fishList = [];
    gold.style.display = "none";
    const treasure = document.getElementById("treasure");
    setArt(treasure, 10);
    treasure.setAttribute('aria-label', 'A closed treasure chest');
}
</script>

</body>
</html>
