<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Number Skills</title>
<style>
:root{--ink:#26394b;--navy:#1e4767;--green:#237f4e;--red:#bd4141}*{box-sizing:border-box}body{margin:0;padding:1rem;background:#edf7f9;color:var(--ink);font:17px/1.5 "Segoe UI",Arial,sans-serif}.shell{max-width:850px;margin:0 auto 2rem;padding:clamp(1rem,4vw,2rem);background:#fffdf7;border:3px solid white;border-radius:20px;box-shadow:0 8px 25px #274c6218}h1{color:var(--navy);font-family:"Comic Sans MS","Chalkboard SE",cursive;font-size:clamp(1.8rem,5vw,2.5rem);margin:.2rem 0 1rem}.settings{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}.settings label{display:flex;flex:1;min-width:170px;flex-direction:column;font-weight:700}.settings select,input,button{font:inherit;min-height:48px;border-radius:10px;padding:.6rem .8rem;border:2px solid #bad4df}select,input{background:white;color:var(--ink)}button{cursor:pointer;background:#2878a9;color:white;font-weight:800;border:0;touch-action:manipulation}button:focus-visible{outline:3px solid #e5b23b;outline-offset:3px}button:disabled{opacity:.55;cursor:default}.question{margin:1rem 0;padding:1.2rem;background:#f4f9f9;border:2px solid #d3e6e7;border-radius:16px;text-align:center}#problem{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:800;color:var(--navy);overflow-wrap:anywhere}.number{font-size:clamp(4rem,18vw,7rem);line-height:1.1}#visual svg{max-width:100%;width:440px;height:auto;display:block;margin:1rem auto}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem;margin:1rem 0}.choices button{background:#e7f3f8;color:var(--navy);border:2px solid #b9d7e3;min-height:65px;font-size:1.5rem}.choices svg{display:block;width:100%;max-height:150px}.response{text-align:center}#answer{width:min(200px,100%);font-size:1.6rem;text-align:center}.controls{display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap;margin:1rem 0}.controls .incorrect{background:var(--red)}.controls .correct{background:var(--green)}#feedback{font-weight:800;text-align:center;min-height:1.6em}#summary{display:none;padding:1rem;background:white;border:1px solid #d4e5eb;border-radius:12px}.stats{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;font-size:.9rem}.note{color:#587284;font-size:.92rem}[hidden]{display:none!important}@media(max-width:550px){body{padding:.6rem}.settings{gap:.5rem}.settings label{min-width:130px}.choices{gap:.5rem}.controls button{flex:1;min-width:120px}}@media print{.settings,#workArea,.controls,.stats{display:none!important}}
</style>
</head>
<body data-beard-run-aware="true">
<main class="shell"><h1>Early Number Skills</h1>
<div class="settings"><label>Skill<select id="skill"><option value="name">Name a numeral</option><option value="count">Count objects</option><option value="match">Match numeral and quantity</option><option value="compare">Compare two numbers</option><option value="missing">Find a missing number</option><option value="bonds">Number bonds</option><option value="place">Tens and ones</option></select></label><label>Number range<select id="range"><option value="5">Within 5</option><option value="10">Within 10</option><option value="20" selected>Within 20</option><option value="100">Within 100</option></select></label></div>
<p class="note" id="directions">An adult marks the child's spoken number name. Changing a level starts a fresh check.</p>
<section id="workArea"><div class="question"><div id="problem" data-beard-problem>Choose a skill, then press Start.</div><div id="visual"></div></div><div id="choices" class="choices"></div><div class="response"><input id="answer" type="number" inputmode="numeric" aria-label="Your answer" hidden><button id="submitBtn" type="button" hidden>Check answer</button></div><div id="oralControls" class="controls" hidden><button type="button" id="incorrectBtn" class="incorrect">Incorrect</button><button type="button" id="correctBtn" class="correct">Correct</button></div></section>
<div class="controls"><button id="startBtn" type="button">Start</button><button id="stopBtn" type="button" disabled>Stop assessment</button><button id="resetBtn" type="button">Reset check</button></div><p id="feedback" aria-live="polite"></p><div class="stats"><span id="attempts" data-beard-correct="0">Attempts: 0</span><span id="score">Score: 0%</span><span id="timer">Time: 0s</span></div><section id="summary" aria-live="polite"></section></main>
<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id), skill=$('skill'),range=$('range'),problem=$('problem'),visual=$('visual'),choices=$('choices'),answer=$('answer'),feedback=$('feedback'),summary=$('summary');
  const labels={name:'Numeral identification',count:'Counting objects',match:'Numeral–quantity matching',compare:'Number comparison',missing:'Missing numbers',bonds:'Number bonds',place:'Tens and ones'};
  let active=false,locked=true,current=null,correct=0,attempts=0,history=[],startedAt=0,stoppedAt=0,timerId=null,nextTimer=null,bag=[];
  const random=()=>typeof window.BeardRun?.random==='function'?window.BeardRun.random():Math.random();
  const integer=(min,max)=>min+Math.floor(random()*(max-min+1));
  function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=integer(0,i);[b[i],b[j]]=[b[j],b[i]];}return b;}
  function level(){return labels[skill.value]+' · within '+range.value;}
  function syncLevel(){document.body.dataset.beardLevel=level();for(const option of range.options)option.disabled=['count','match'].includes(skill.value)&&Number(option.value)>20;if(['count','match'].includes(skill.value)&&Number(range.value)>20)range.value='20';document.body.dataset.beardLevel=level();$('directions').textContent=skill.value==='name'?"An adult marks the child's spoken number name. Use the buttons or keys 1 and 2.":'Respond independently using the number box or choices. Changing a level starts a fresh check.';}
  function updateStats(){const percent=attempts?Math.round(correct/attempts*100):0;$('attempts').textContent='Attempts: '+attempts;$('attempts').dataset.beardCorrect=String(correct);$('score').textContent='Score: '+percent+'%';}
  function elapsed(){return startedAt?Math.max(0,((stoppedAt||Date.now())-startedAt)/1000):0;}
  function dots(count){let shapes='';for(let i=0;i<count;i++){const x=34+(i%5)*75,y=35+Math.floor(i/5)*54;shapes+='<circle cx="'+x+'" cy="'+y+'" r="12" fill="#244e65"/>'; }return '<svg viewBox="0 0 380 220" role="img" aria-label="A group of '+count+' dots"><rect x="2" y="2" width="376" height="216" rx="12" fill="#fffdf7" stroke="#d0e2e8"/>'+shapes+'</svg>';}
  function quantity(){if(!bag.length)bag=shuffle(Array.from({length:Number(range.value)+1},(_,i)=>i));return bag.pop();}
  function setPrompt(text){problem.textContent=text;problem.dataset.beardProblem=text;}
  function optionButton(label,value,html){const button=document.createElement('button');button.type='button';if(html)button.innerHTML=html;else button.textContent=label;button.setAttribute('aria-label',label);button.addEventListener('click',()=>respond(value));choices.appendChild(button);}
  function nextQuestion(){
    if(!active)return;clearTimeout(nextTimer);locked=false;feedback.textContent='';visual.innerHTML='';choices.replaceChildren();answer.value='';answer.type=skill.value==='name'||skill.value==='match'||skill.value==='compare'?'hidden':'number';answer.hidden=['name','match','compare'].includes(skill.value);$('submitBtn').hidden=answer.hidden;$('oralControls').hidden=skill.value!=='name';const max=Number(range.value);let target=quantity();
    if(skill.value==='name'){setPrompt('Name this number: '+target);visual.innerHTML='<div class="number" aria-hidden="true">'+target+'</div>';current={answer:target,prompt:'Name the numeral '+target,oral:true};}
    else if(skill.value==='count'){setPrompt('Count the dots. How many?');visual.innerHTML=dots(target);current={answer:target,prompt:'Count '+target+' dots'};}
    else if(skill.value==='match'){setPrompt('Which group matches the numeral '+target+'?');const distractors=shuffle(Array.from({length:max+1},(_,i)=>i).filter(n=>n!==target)).slice(0,3);for(const n of shuffle([target,...distractors]))optionButton(n+' dots',n,dots(n));current={answer:target,prompt:'Match numeral '+target+' to a dot group'};}
    else if(skill.value==='compare'){let other=integer(0,max-1);if(other>=target)other++;setPrompt('Which of these two numbers is greater: '+target+' or '+other+'?');for(const n of shuffle([target,other]))optionButton(String(n),n);current={answer:Math.max(target,other),prompt:'Greater number: '+target+' or '+other};}
    else if(skill.value==='missing'){const start=integer(0,Math.max(0,max-3));setPrompt(start+', '+(start+1)+', _____, '+(start+3));current={answer:start+2,prompt:'Missing number: '+start+', '+(start+1)+', __, '+(start+3)};}
    else if(skill.value==='bonds'){const known=integer(0,target);setPrompt('The whole is '+target+'. One part is '+known+'. What is the missing part?');visual.innerHTML='<svg viewBox="0 0 380 220" role="img" aria-label="Number bond: whole '+target+', known part '+known+', missing other part"><path d="M190 75L110 150M190 75L270 150" fill="none" stroke="#81aabc" stroke-width="4"/><g fill="#fffdf7" stroke="#648797" stroke-width="3"><circle cx="190" cy="55" r="42"/><circle cx="100" cy="166" r="42"/><circle cx="280" cy="166" r="42"/></g><g fill="#244e65" text-anchor="middle" font-family="sans-serif" font-size="35" font-weight="700"><text x="190" y="67">'+target+'</text><text x="100" y="178">'+known+'</text><text x="280" y="178">?</text></g></svg>';current={answer:target-known,prompt:'Number bond: whole '+target+', known part '+known};}
    else{const tens=Math.floor(target/10),ones=target%10;setPrompt(tens+' tens and '+ones+' ones make what number?');current={answer:target,prompt:tens+' tens and '+ones+' ones'};}
    problem.dataset.beardProblem=current.prompt;if(!answer.hidden)answer.focus();
  }
  function respond(value,oralOutcome){if(!active||locked||!current)return;if(value===undefined){const raw=answer.value.trim();if(raw==='')return;value=Number(raw);if(!Number.isFinite(value))return;}locked=true;const outcome=oralOutcome===undefined?value===current.answer:oralOutcome;answer.value=current.oral?'Oral response (adult marked)':String(value);attempts++;if(outcome)correct++;history.push({problem:current.prompt,answer:answer.value,expected:current.answer,correct:outcome,elapsedSeconds:elapsed()});updateStats();feedback.textContent=outcome?'Correct!':'Incorrect. The correct answer is '+current.answer+'.';feedback.style.color=outcome?'#237f4e':'#bd4141';choices.querySelectorAll('button').forEach(b=>b.disabled=true);nextTimer=setTimeout(nextQuestion,700);}
  function clearRun(){clearTimeout(nextTimer);clearInterval(timerId);active=false;locked=true;current=null;correct=0;attempts=0;history=[];bag=[];startedAt=0;stoppedAt=0;summary.style.display='none';summary.replaceChildren();feedback.textContent='';$('workArea').hidden=false;updateStats();$('timer').textContent='Time: 0s';$('stopBtn').disabled=true;$('startBtn').disabled=false;choices.replaceChildren();visual.innerHTML='';answer.hidden=true;$('submitBtn').hidden=true;$('oralControls').hidden=true;setPrompt('Choose a skill, then press Start.');}
  function start(){clearRun();syncLevel();active=true;locked=false;startedAt=Date.now();$('stopBtn').disabled=false;$('startBtn').disabled=true;timerId=setInterval(()=>{$('timer').textContent='Time: '+Math.floor(elapsed())+'s';},250);nextQuestion();}
  function stop(){if(!active)return;const seconds=elapsed();stoppedAt=Date.now();active=false;locked=true;clearTimeout(nextTimer);clearInterval(timerId);$('workArea').hidden=true;$('stopBtn').disabled=true;$('startBtn').disabled=false;feedback.textContent='';summary.innerHTML='<h2>Assessment Results</h2><p>Attempts: '+attempts+' · Correct: '+correct+' · Score: '+(attempts?Math.round(correct/attempts*100):0)+'% · Total time: '+seconds.toFixed(1)+' seconds</p>';summary.style.display='block';}
  $('startBtn').addEventListener('click',start);$('resetBtn').addEventListener('click',clearRun);$('stopBtn').addEventListener('click',stop);$('submitBtn').addEventListener('click',()=>respond());$('correctBtn').addEventListener('click',()=>respond(current?.answer,true));$('incorrectBtn').addEventListener('click',()=>respond(current?.answer,false));answer.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();respond();}});
  document.addEventListener('keydown',event=>{if(event.repeat||event.target.matches('input,textarea,select,[contenteditable="true"]'))return;if(skill.value==='name'&&event.key==='1')respond(current?.answer,true);else if(skill.value==='name'&&event.key==='2')respond(current?.answer,false);});
  for(const select of [skill,range])select.addEventListener('change',()=>{syncLevel();clearRun();document.dispatchEvent(new CustomEvent('beard:settings-changed',{detail:{level:level()}}));});
  document.addEventListener('beard:run-start',start);
  window.BeardAssessment={start,reset:clearRun,stop,getState:()=>({assessment:'Early Number Skills',level:level(),correct,attempts,errors:attempts-correct,seconds:elapsed(),responses:history.slice()})};syncLevel();clearRun();
})();
</script>
</body></html>
