<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Subitizing Assessment</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#eef7ff;
    text-align:center;
    margin:20px;
}

h1{
    color:#1565c0;
}

#dotBoard{
    width:340px;
    height:240px;
    margin:auto;
    background:white;
    border:4px solid #444;
    border-radius:15px;
}

input{
    font-size:28px;
    width:100px;
    text-align:center;
    margin-top:20px;
}

button{
    font-size:18px;
    padding:10px 20px;
    margin:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#submitBtn{background:#4CAF50;color:white;}
#resetBtn{background:#f44336;color:white;}
#stopBtn{background:#2196F3;color:white;}

#feedback{
    font-size:22px;
    margin-top:15px;
    height:30px;
}

#score,#timer,#attempts{
    font-weight:bold;
    font-size:18px;
    margin:10px;
}

table{
    margin:auto;
    border-collapse:collapse;
}

td,th{
    border:1px solid #ccc;
    padding:6px 10px;
}

.correct{color:green;}
.incorrect{color:red;}
</style>

</head>

<body>

<h1>Subitizing Assessment</h1>

<div id="score">Score: 0%</div>

<svg id="dotBoard" viewBox="0 0 340 240"></svg>

<br>

<input type="number" id="answer" autocomplete="off">

<br>

<button id="submitBtn">Submit</button>
<button id="resetBtn">Reset</button>
<button id="stopBtn">Stop</button>

<div id="feedback"></div>

<div id="timer">Time: 0 s</div>

<div id="attempts">Attempts: 0</div>

<div id="summary"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let currentAnswer=0;

let attempts=0;
let correct=0;
let time=0;

let timer;
let history=[];

function startTimer(){

timer=setInterval(()=>{
time++;
document.getElementById("timer").innerHTML="Time: "+time+" s";
},1000);

}

function stopTimer(){
clearInterval(timer);
}

function randomProblem(){

currentAnswer=Math.floor(Math.random()*7);

drawDots(currentAnswer);

document.getElementById("answer").value="";
document.getElementById("feedback").innerHTML="";
document.getElementById("answer").focus();

setTimeout(()=>{
document.getElementById("dotBoard").innerHTML="";
},2000);

}

function drawDots(n){

const svg=document.getElementById("dotBoard");

svg.innerHTML="";

if(n===0)return;

let pts=[];

while(pts.length<n){

let x=30+Math.random()*280;
let y=30+Math.random()*180;

let good=true;

for(let p of pts){

let dx=x-p.x;
let dy=y-p.y;

if(Math.sqrt(dx*dx+dy*dy)<45){
good=false;
break;
}

}

if(good){

pts.push({x,y});

}

}

pts.forEach(p=>{

let c=document.createElementNS("http://www.w3.org/2000/svg","circle");

c.setAttribute("cx",p.x);
c.setAttribute("cy",p.y);
c.setAttribute("r",13);
c.setAttribute("fill","#222");

svg.appendChild(c);

});

}

function updateScore(){

let percent=attempts==0?0:Math.round(correct/attempts*100);

document.getElementById("score").innerHTML="Score: "+percent+"%";
document.getElementById("attempts").innerHTML="Attempts: "+attempts;

}

function submitAnswer(){

let value=parseInt(document.getElementById("answer").value);

if(isNaN(value))return;

attempts++;

let wasCorrect=value===currentAnswer;

if(wasCorrect){

correct++;

document.getElementById("feedback").innerHTML="Correct!";
document.getElementById("feedback").style.color="green";

}
else{

document.getElementById("feedback").innerHTML=
"Incorrect. Correct answer was "+currentAnswer;

document.getElementById("feedback").style.color="red";

}

history.push({
shown:currentAnswer,
response:value,
correct:wasCorrect
});

updateScore();

setTimeout(randomProblem,1200);

}

function resetAll(){

stopTimer();

attempts=0;
correct=0;
time=0;
history=[];

document.getElementById("summary").innerHTML="";

updateScore();

document.getElementById("timer").innerHTML="Time: 0 s";

startTimer();

randomProblem();

}

function stopAll(){

stopTimer();

let percent=attempts==0?0:Math.round(correct/attempts*100);

let html="<h2>Assessment Results</h2>";

html+="<p><b>Attempts:</b> "+attempts+"<br>";
html+="<b>Correct:</b> "+correct+"<br>";
html+="<b>Accuracy:</b> "+percent+"%<br>";
html+="<b>Time:</b> "+time+" seconds</p>";

html+="<table>";
html+="<tr><th>Dots</th><th>Student</th><th>Result</th></tr>";

history.forEach(h=>{

html+="<tr>";

html+="<td>"+h.shown+"</td>";

html+="<td>"+h.response+"</td>";

html+="<td class='"+(h.correct?"correct":"incorrect")+"'>";

html+=h.correct?"Correct":"Incorrect";

html+="</td></tr>";

});

html+="</table>";

html+="<br><button onclick='downloadPDF()'>Download PDF</button>";

document.getElementById("summary").innerHTML=html;

}

async function downloadPDF(){

const {jsPDF}=window.jspdf;

const doc=new jsPDF();

doc.setFontSize(18);

doc.text("Subitizing Assessment",20,20);

doc.setFontSize(12);

doc.text("Attempts: "+attempts,20,35);
doc.text("Correct: "+correct,20,43);
doc.text("Accuracy: "+Math.round(correct/attempts*100)+"%",20,51);
doc.text("Time: "+time+" sec",20,59);

let y=75;

history.forEach((h,i)=>{

doc.text(
(i+1)+". Dots:"+h.shown+
"   Student:"+h.response+
"   "+(h.correct?"Correct":"Incorrect"),
20,y
);

y+=8;

if(y>270){

doc.addPage();

y=20;

}

});

doc.save("Subitizing_Assessment.pdf");

}

document.getElementById("submitBtn").onclick=submitAnswer;

document.getElementById("resetBtn").onclick=resetAll;

document.getElementById("stopBtn").onclick=stopAll;

document.getElementById("answer").addEventListener("keydown",e=>{

if(e.key==="Enter")submitAnswer();

});

startTimer();

randomProblem();

</script>

</body>
</html>
