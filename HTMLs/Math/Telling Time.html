<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analog Clock Time Assessment</title>

<style>
  body {
    font-family: "Poppins", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: linear-gradient(135deg, #a0e3ff, #fff0a5);
    margin: 0;
  }

  h1 { margin-bottom: 10px; }

  canvas {
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
    margin: 20px;
  }

  select {
    font-size: 1.5rem;
    padding: 5px;
    margin: 5px;
  }

  button {
    font-size: 1.2rem;
    padding: 10px 20px;
    border: none;
    background-color: #4caf50;
    color: white;
    border-radius: 10px;
    margin: 10px;
    cursor: pointer;
  }

  #reset { background-color: #f44336; }
  #stop { background-color: #2196f3; }
  #pdfBtn { background-color: #ff9800; display:none; }

  #feedback { font-size: 1.3rem; font-weight: bold; margin-top: 10px; }

  #score, #attempts, #timer {
    position: absolute;
    font-size: 1.1rem;
    background-color: #ffffff99;
    padding: 6px 10px;
    border-radius: 10px;
  }

  #score { top: 15px; right: 25px; }
  #attempts { bottom: 15px; right: 25px; }
  #timer { bottom: 15px; left: 25px; }

  #summary {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 600px;
    background-color: #ffffffcc;
    border-radius: 20px;
    padding: 20px;
  }

  .correct { color: green; }
  .incorrect { color: red; }
</style>
</head>

<body>

<div id="score">Score: 0%</div>
<h1>Read the Clock</h1>

<canvas id="clockCanvas" width="400" height="400"></canvas>

<div>
  <select id="hourSelect"></select> :
  <select id="minuteSelect"></select>
</div>

<div>
  <button onclick="checkAnswer()">Check</button>
  <button onclick="newProblem()">Next</button>
  <button id="reset" onclick="resetAll()">Reset</button>
</div>

<button id="stop" onclick="stopSession()">Stop</button>
<button id="pdfBtn" onclick="downloadPDF()">Download PDF</button>

<div id="feedback"></div>
<div id="attempts">Attempts: 0</div>
<div id="timer">Time: 0s</div>
<div id="summary"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
let correctTime = "";
let totalQuestions = 0;
let correctAnswers = 0;
let answered = false;
let timeElapsed = 0;
let timerInterval = null;
let history = [];

const canvas = document.getElementById("clockCanvas");
const ctx = canvas.getContext("2d");

// ===== POPULATE DROPDOWNS =====
function populateDropdowns() {
  const hourSelect = document.getElementById("hourSelect");
  const minuteSelect = document.getElementById("minuteSelect");

  hourSelect.innerHTML = "";
  minuteSelect.innerHTML = "";

  for (let h = 1; h <= 12; h++) {
    let opt = document.createElement("option");
    opt.value = h;
    opt.textContent = h;
    hourSelect.appendChild(opt);
  }

  for (let m = 0; m < 60; m++) {
    let opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m.toString().padStart(2, "0");
    minuteSelect.appendChild(opt);
  }
}

// ===== DRAW CLOCK =====
function drawClock(hour, minute) {
  ctx.clearRect(0,0,400,400);

  const centerX = 200;
  const centerY = 200;

  ctx.beginPath();
  ctx.arc(centerX, centerY, 180, 0, 2*Math.PI);
  ctx.fillStyle = "white";
  ctx.fill();
  ctx.stroke();

  for (let i = 0; i < 60; i++) {
    let angle = i * Math.PI / 30;

    let outerX = centerX + Math.sin(angle) * 170;
    let outerY = centerY - Math.cos(angle) * 170;

    let innerRadius = (i % 5 === 0) ? 140 : 155;

    let innerX = centerX + Math.sin(angle) * innerRadius;
    let innerY = centerY - Math.cos(angle) * innerRadius;

    ctx.beginPath();
    ctx.lineWidth = (i % 5 === 0) ? 4 : 1.5;
    ctx.moveTo(innerX, innerY);
    ctx.lineTo(outerX, outerY);
    ctx.stroke();
  }

  ctx.fillStyle = "black";
  ctx.font = "bold 32px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for (let num = 1; num <= 12; num++) {
    let angle = num * Math.PI / 6;
    let x = centerX + Math.sin(angle) * 135;
    let y = centerY - Math.cos(angle) * 135;
    ctx.fillText(num, x, y);
  }

  let hourAngle = (hour % 12) * Math.PI / 6 + minute * Math.PI / 360;
  let minAngle = minute * Math.PI / 30;

  drawHand(hourAngle, 90, 8);
  drawHand(minAngle, 140, 4);
}

function drawHand(angle, length, width){
  ctx.beginPath();
  ctx.lineWidth = width;
  ctx.moveTo(200,200);
  ctx.lineTo(
    200 + Math.sin(angle)*length,
    200 - Math.cos(angle)*length
  );
  ctx.stroke();
}

// ===== NEW PROBLEM =====
function newProblem() {
  answered = false;
  document.getElementById("feedback").textContent = "";

  let hour = Math.floor(Math.random()*12) + 1;
  let minute = Math.floor(Math.random()*12) * 5;

  correctTime = `${hour}:${minute}`;
  canvas.dataset.beardProblem = `Read the clock: ${hour}:${String(minute).padStart(2, "0")}`;

  drawClock(hour, minute);
}

// ===== CHECK ANSWER =====
function checkAnswer(){
  if(answered) return;

  const h = document.getElementById("hourSelect").value;
  const m = document.getElementById("minuteSelect").value;

  totalQuestions++;
  answered = true;

  let user = `${h}:${m}`;
  let correct = user === correctTime;

  if(correct){
    correctAnswers++;
    document.getElementById("feedback").textContent = "✅ Correct!";
    document.getElementById("feedback").style.color = "green";
  } else {
    document.getElementById("feedback").textContent = `❌ It was ${correctTime}`;
    document.getElementById("feedback").style.color = "red";
  }

  history.push({
    student: user,
    correctAnswer: correctTime,
    correct: correct
  });

  updateStats();
  setTimeout(newProblem, 1000);
}

// ===== STATS =====
function updateStats(){
  let percent = totalQuestions===0?0:Math.round(correctAnswers/totalQuestions*100);
  document.getElementById("score").textContent = `Score: ${percent}%`;
  document.getElementById("attempts").textContent = `Attempts: ${totalQuestions}`;
}

// ===== RESET =====
function resetAll(){
  totalQuestions=0;
  correctAnswers=0;
  timeElapsed=0;
  history=[];
  clearInterval(timerInterval);
  timerInterval=null;
  document.getElementById("summary").style.display="none";
  document.getElementById("pdfBtn").style.display="none";
  updateStats();
  newProblem();
  startTimer();
}

// ===== STOP =====
function stopSession(){
  clearInterval(timerInterval);

  let percent = totalQuestions===0?0:Math.round(correctAnswers/totalQuestions*100);

  let html = `<h2>Summary</h2>
  <p>Time: ${timeElapsed}s</p>
  <p>Score: ${percent}%</p><hr>`;

  history.forEach(q=>{
    html += `<p class="${q.correct ? 'correct' : 'incorrect'}">
      ${q.student} ${q.correct ? "✔" : `(Correct: ${q.correctAnswer})`}
    </p>`;
  });

  html += `<button onclick="resetAll()">Play Again</button>`;

  document.getElementById("summary").innerHTML = html;
  document.getElementById("summary").style.display="flex";
  document.getElementById("pdfBtn").style.display="inline-block";
}

// ===== TIMER =====
function startTimer(){
  if(timerInterval) return;
  timerInterval = setInterval(()=>{
    timeElapsed++;
    document.getElementById("timer").textContent = `Time: ${timeElapsed}s`;
  },1000);
}

// ===== PDF =====
function downloadPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y=20;

  doc.text("Clock Assessment Report",10,10);

  history.forEach(q=>{
    doc.text(`${q.student} - ${q.correct ? "Correct" : "Incorrect ("+q.correctAnswer+")"}`,10,y);
    y+=8;
  });

  doc.save("clock_report.pdf");
}

// INIT
populateDropdowns();
newProblem();
startTimer();
</script>

</body>
</html>
