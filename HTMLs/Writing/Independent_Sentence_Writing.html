<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Independent Sentence Writing Goal Check</title>
<style>
:root{--navy:#1e4767;--ink:#26394b;--line:#cfe2ed;--cream:#fffdf7;--green:#237f4e;--red:#bd4141}*{box-sizing:border-box}body{margin:0;padding:1rem;background:linear-gradient(135deg,#e8f6ff,#fff9e9);color:var(--ink);font:1rem/1.5 "Avenir Next","Segoe UI",sans-serif}.shell{max-width:950px;margin:auto;padding:clamp(1rem,4vw,2rem);border:3px solid #fff;border-radius:22px;background:var(--cream);box-shadow:0 10px 28px #1e47671a}h1,h2{color:var(--navy);font-family:"Comic Sans MS","Chalkboard SE",cursive;line-height:1.15}h1{margin:.3rem 0 1rem;font-size:clamp(1.8rem,5vw,2.5rem)}h2{font-size:1.4rem}.eyebrow{color:#617888;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.settings,.controls{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin:1rem 0}label{font-weight:800}select,textarea,button{font:inherit}select{max-width:100%;padding:.55rem;border:2px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}textarea{display:block;width:100%;min-height:200px;margin:.6rem 0;padding:1rem;border:2px solid #a8c8da;border-radius:12px;background:#fff;font-size:1.3rem;line-height:1.6;resize:vertical}button{min-height:46px;padding:.65rem 1rem;border:0;border-radius:10px;background:#2878a9;color:#fff;font-weight:850;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55;cursor:default}.danger{background:#c85b56}.secondary{background:#816844}button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #94d0ed;outline-offset:3px}.prompt{padding:1.2rem;border:2px solid var(--line);border-radius:16px;background:#eef8fb;color:var(--navy);font-size:1.5rem;font-weight:850}.small{color:#567181;font-size:.9rem}.meta{padding:1rem;border-radius:10px;background:#edf7fb;line-height:1.7}.sample{padding:1rem;border:1px solid var(--line);border-radius:12px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere}.rubric{display:grid;gap:.7rem}.rubric-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8rem;align-items:center;padding:.85rem;border:1px solid var(--line);border-radius:12px;background:#fff}.rubric-row b{display:block}.choices{display:flex;gap:.6rem;flex-wrap:wrap}.choices label{display:flex;gap:.35rem;align-items:center;padding:.65rem;border:1px solid var(--line);border-radius:8px;cursor:pointer}.choices input{width:20px;height:20px;accent-color:var(--green)}.pending{color:#8a6425}.good{color:var(--green)}.bad{color:var(--red)}#summary{display:none;margin-top:1rem}#timer{color:#536f80;font-weight:800}[hidden]{display:none!important}@media(max-width:620px){body{padding:.6rem}.shell{padding:1rem}.settings{display:grid;grid-template-columns:1fr}.rubric-row{grid-template-columns:1fr}.choices{display:grid;grid-template-columns:repeat(2,1fr)}.controls button{flex:1}}@media print{body{padding:0;background:#fff}.shell{border:0;box-shadow:none;max-width:none}.workspace,.controls,#timer{display:none!important}#summary{display:block!important}.rubric-row{break-inside:avoid}}
</style></head><body data-beard-level="One complete sentence" data-beard-skill="Independent sentence writing" data-beard-run-aware="true">
<main class="shell"><header><p class="eyebrow">Writing · Your own words</p><h1>Independent Sentence Writing</h1><p>Write your own response to the prompt. An adult checks the writing after the student finishes.</p></header>
<section id="workArea" class="workspace"><div class="settings"><label>Writing level <select id="level"><option value="sentence">1 · One complete sentence</option><option value="detail">2 · A sentence with a detail</option><option value="connected">3 · Two connected sentences</option></select></label><label>Response format <select id="format"><option value="typed">Type here</option><option value="handwritten">Write on paper</option></select></label></div>
<p id="prompt" class="prompt" data-beard-prompt aria-live="polite"></p><label id="sampleLabel" for="answer">Student writing</label><textarea id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-describedby="sampleHelp"></textarea><p id="sampleHelp" class="small">Write independently using the supports documented for this goal. Adult prompting and assistance should be noted on the score export.</p><label id="paperCheck" hidden><input type="checkbox" id="paperCollected"> A handwritten sample has been collected. A transcription above is optional.</label><div class="controls"><button type="button" class="danger" id="stopBtn">Finish writing</button><button type="button" class="secondary" id="resetBtn">Reset check</button></div></section>
<p id="timer" aria-live="polite">Time: 0s</p><section id="summary" data-beard-hide-auto-history aria-live="polite"></section></main>
<script>
(() => {
  'use strict';
  const topics=['a game you enjoy','an animal you like','something you do at school','a food you enjoy','a place you like to visit','something you do outside','a helpful thing you can do','something you do in the morning','a book or story you enjoy','something you make or build','a time you felt happy','something you want to learn','a way to help a friend','a favorite season','something you notice in nature','a place where you feel comfortable'];
  const names={sentence:'One complete sentence',detail:'A sentence with a detail',connected:'Two connected sentences'};
  const $=id=>document.getElementById(id),level=$('level'),format=$('format'),answer=$('answer'),summary=$('summary');
  let prompt='',startedAt=0,stoppedSeconds=0,ended=false,timer=null,settings={},sample='',ratings=[null,null,null,null];
  const random=()=>window.BeardRun&&typeof window.BeardRun.random==='function'?window.BeardRun.random():Math.random();
  const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function criteria(){return [{label:'Meaning and task',detail:level.value==='connected'?'Two connected sentences express related, complete ideas.':level.value==='detail'?'A complete sentence includes a meaningful detail.':'A complete sentence expresses a meaningful idea.'},{label:'Capitalization',detail:'Each sentence begins with a capital letter.'},{label:'Word spacing',detail:'Spaces separate the words.'},{label:'End punctuation',detail:'Each sentence ends with appropriate punctuation.'}]}
  function elapsed(){return Math.max(0,(Date.now()-startedAt)/1000)}
  function state(){const pending=!ended||ratings.some(v=>v===null),correct=ratings.filter(v=>v===true).length;return {assessment:document.title,skill:'Independent sentence writing',level:names[level.value],mode:settings.mode||'practice',formId:settings.formId||'',scoreType:pending?'Pending':'Rubric',score:pending?null:correct/4,attempts:4,correct:pending?null:correct,errors:pending?null:4-correct,percentage:pending?null:Math.round(correct/4*100),seconds:ended?stoppedSeconds:elapsed(),pending,gradedCriteria:ratings.filter(v=>v!==null).length,sample,format:format.value,responses:criteria().map((c,i)=>({prompt:c.label+' — '+c.detail,answer:ratings[i]===null?'Not rated':ratings[i]?'Met':'Not yet',outcome:ratings[i],seconds:null,studentWriting:sample,writingPrompt:prompt,responseFormat:format.value}))}}
  function notify(){document.dispatchEvent(new CustomEvent('beard:report-updated'))}
  function updateScore(){const s=state(),score=$('rubricScore');if(score){score.textContent=s.pending?'Score: Pending — rate all four criteria':'Rubric: '+s.correct+' of 4 criteria met ('+s.percentage+'%)';score.className=s.pending?'pending':'good'}notify()}
  function finish(){if(ended)return;const text=answer.value.trim();if(format.value==='typed'&&!text){answer.focus();return}if(format.value==='handwritten'&&!text&&!$('paperCollected').checked){$('paperCollected').focus();return}sample=text||(format.value==='handwritten'?'Handwritten sample collected; see paper sample.':'');stoppedSeconds=elapsed();ended=true;clearInterval(timer);$('workArea').hidden=true;const date=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});summary.innerHTML='<h2>Writing Sample &amp; Teacher Rubric</h2><p class="meta"><strong>Assessment:</strong> '+escapeHtml(document.title)+'<br><strong>Date:</strong> '+date+' · <strong>Level:</strong> '+escapeHtml(names[level.value])+'<br><strong>Format:</strong> '+(format.value==='typed'?'Typed':'Handwritten')+' · <strong>Writing time:</strong> '+stoppedSeconds.toFixed(1)+' s<br><strong id="rubricScore" class="pending">Score: Pending — rate all four criteria</strong></p><p><strong>Prompt:</strong> '+escapeHtml(prompt)+'</p><div class="sample">'+escapeHtml(sample)+'</div><p class="small">Teacher ratings are required. This four-criterion goal check is not an automatic writing grade. Record spelling separately if spelling is part of the student’s goal.</p><div class="rubric">'+criteria().map((c,i)=>'<div class="rubric-row"><div><b>'+escapeHtml(c.label)+'</b>'+escapeHtml(c.detail)+'</div><div class="choices"><label><input type="radio" name="criterion-'+i+'" value="met" data-rating="'+i+'"> Met</label><label><input type="radio" name="criterion-'+i+'" value="not-yet" data-rating="'+i+'"> Not yet</label></div></div>').join('')+'</div><div class="controls"><button type="button" id="reportReset">Start a New Check</button><button type="button" id="reportPrint">Print / Save PDF</button></div>';summary.style.display='block';summary.querySelectorAll('[data-rating]').forEach(input=>input.addEventListener('change',()=>{ratings[Number(input.dataset.rating)]=input.value==='met';updateScore()}));$('reportReset').addEventListener('click',()=>reset());$('reportPrint').addEventListener('click',()=>window.print());notify()}
  function renderFormat(){const paper=format.value==='handwritten';$('paperCheck').hidden=!paper;$('sampleLabel').textContent=paper?'Optional transcription of the paper sample':'Student writing';answer.placeholder=paper?'Optional: type the student’s words exactly as written.':'Write your own sentence here.';document.body.dataset.beardResponseFormat=format.value}
  function reset(runSettings){settings=runSettings&&runSettings.mode?{...runSettings}:{...(window.BeardRunSettings||settings)};clearInterval(timer);ended=false;ratings=[null,null,null,null];sample='';stoppedSeconds=0;answer.value='';$('paperCollected').checked=false;startedAt=Date.now();const topic=topics[Math.floor(random()*topics.length)];prompt=level.value==='connected'?'Write two connected sentences about '+topic+'.':level.value==='detail'?'Write one complete sentence about '+topic+'. Include one detail.':'Write one complete sentence about '+topic+'.';$('prompt').textContent=prompt;document.body.dataset.beardLevel=names[level.value];$('workArea').hidden=false;summary.style.display='none';summary.replaceChildren();renderFormat();$('timer').textContent='Time: 0s';timer=setInterval(()=>$('timer').textContent='Time: '+Math.floor(elapsed())+'s',1000)}
  $('stopBtn').addEventListener('click',finish);$('resetBtn').addEventListener('click',()=>reset());level.addEventListener('change',()=>{reset();document.dispatchEvent(new CustomEvent('beard:settings-changed',{detail:{level:names[level.value],skill:'Independent sentence writing'}}))});format.addEventListener('change',()=>{renderFormat();document.dispatchEvent(new CustomEvent('beard:settings-changed',{detail:{level:names[level.value],responseFormat:format.value}}))});document.addEventListener('beard:run-start',event=>reset(event.detail&&event.detail.settings));
  window.BeardAssessmentState={getReport:state,reset:()=>reset(),stop:finish};window.BeardAssessment={start:reset,reset,stop:finish,getState:state};reset();
})();
</script></body></html>
