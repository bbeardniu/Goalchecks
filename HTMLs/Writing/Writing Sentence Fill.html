<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sentence Practice Assessment</title>
<style>
  :root {
    --bg1: #93c5fd;
    --bg2: #fef08a;
    --card: #ffffff;
    --green: #16a34a;
    --red: #dc2626;
    --blue: #2563eb;
    --text: #0f172a;
  }
  html, body {
    height: 100%;
    margin: 0;
    font-family: "Poppins", Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .wrap {
    width: 95%;
    max-width: 700px;
    background: var(--card);
    border-radius: 18px;
    padding: 32px;
    box-shadow: 0 8px 24px rgba(2,6,23,0.12);
  }
  h1 {
    margin: 0 0 12px 0;
    color: #1e3a8a;
    font-size: 28px;
  }
  #sentence {
    font-size: 30px;
    line-height: 1.3;
    font-weight: 700;
    color: var(--text);
    margin: 30px 0;
    user-select: none;
  }
  input {
    font-size: 28px;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid var(--blue);
    width: 70%;
    text-align: center;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  button {
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    cursor: pointer;
    color: white;
    font-size: 18px;
  }
  .btn-green { background: var(--green); }
  .btn-green:hover { background: #15803d; }
  .btn-red { background: var(--red); }
  .btn-red:hover { background: #c63025; }
  .btn-blue { background: var(--blue); }
  .btn-blue:hover { background: #1e61d4; }
  #feedback { margin-top: 18px; font-weight: 600; font-size: 22px; min-height: 30px; }
  #timer {
    position: fixed;
    bottom: 16px;
    left: 20px;
    background: rgba(255,255,255,0.9);
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: 600;
    color: #334155;
    font-size: 18px;
  }
  #summary {
    display: none;
    margin-top: 18px;
    text-align: left;
    width: 100%;
    padding: 18px;
    border-radius: 10px;
    background: rgba(15,23,42,0.03);
    font-size: 18px;
  }
  .correct { color: var(--green); font-weight: 700; }
  .incorrect { color: var(--red); font-weight: 700; }
  @media (max-width: 480px) {
    #sentence { font-size: 24px; }
    input { font-size: 22px; width: 90%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sentence Practice Assessment</h1>
  <div id="sentence" aria-live="polite">Press Start to begin</div>
  <input id="answerInput" placeholder="Type your answer here..." disabled />
  <div class="controls">
    <button class="btn-green" id="startBtn">Start</button>
    <button class="btn-blue" id="nextBtn" disabled>Next</button>
    <button class="btn-red" id="stopBtn">Stop</button>
  </div>
  <div id="feedback" aria-live="polite"></div>
  <div id="summary" aria-live="polite"></div>
</div>
<div id="timer">Time: 0s</div>

<script>
(function(){
  'use strict';
  document.body.dataset.beardRunAware='true';
  document.body.dataset.beardLevel='Open sentence completion';
  const sentences=["The cat ____ up the tree.","She ____ her lunch at the park.","The rain ____ falling all day.","He ____ the ball over the fence.","The baby ____ when she saw the clown.","They ____ a movie together last night.","The wind ____ through the tall trees.","Mom ____ cookies for the bake sale.","The sun ____ behind the clouds.","The dog ____ loudly at the mailman."];
  const $=id=>document.getElementById(id),sentenceEl=$('sentence'),inputEl=$('answerInput'),feedbackEl=$('feedback'),timerEl=$('timer'),summaryDiv=$('summary'),startBtn=$('startBtn'),nextBtn=$('nextBtn'),stopBtn=$('stopBtn');
  sentenceEl.setAttribute('data-beard-prompt','');
  summaryDiv.setAttribute('data-beard-hide-auto-history','');
  let pool=[],currentSentence=null,answers=[],startTime=null,timerInterval=null,elapsed=0,active=false,questionAt=0,settings={};
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function shuffle(a){const random=window.BeardRun&&typeof window.BeardRun.random==='function'?window.BeardRun.random:Math.random;for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function seconds(){return active&&startTime!==null?Math.max(0,(Date.now()-startTime)/1000):elapsed}
  function state(){const pending=answers.some(a=>a.correct===null),correct=answers.filter(a=>a.correct===true).length;return {assessment:document.title,skill:'Open sentence completion',level:'Open sentence completion',mode:settings.mode||'practice',formId:settings.formId||'',scoreType:pending?'Pending':'Accuracy',score:pending||!answers.length?null:correct/answers.length,attempts:answers.length,correct:pending?null:correct,errors:pending?null:answers.length-correct,percentage:pending||!answers.length?null:Math.round(correct/answers.length*100),pending,seconds:seconds(),responses:answers.map(a=>({...a,prompt:a.sentence,outcome:a.correct}))}}
  function notify(){document.dispatchEvent(new CustomEvent('beard:report-updated'))}
  function stopTimer(){clearInterval(timerInterval);timerInterval=null}
  function showSentence(){if(!pool.length){currentSentence=null;stopGame();return}currentSentence=pool.pop();sentenceEl.textContent=currentSentence;inputEl.value='';inputEl.disabled=false;questionAt=Date.now();inputEl.focus()}
  function startGame(runSettings){settings=runSettings&&runSettings.mode?{...runSettings}:{...(window.BeardRunSettings||settings)};stopTimer();active=true;elapsed=0;startTime=Date.now();answers=[];pool=shuffle(sentences.slice());summaryDiv.style.display='none';summaryDiv.replaceChildren();startBtn.disabled=true;nextBtn.disabled=false;stopBtn.disabled=false;inputEl.disabled=false;feedbackEl.textContent='';showSentence();timerEl.textContent='Time: 0s';timerInterval=setInterval(()=>timerEl.textContent='Time: '+Math.floor(seconds())+'s',1000)}
  function saveCurrent(){if(!currentSentence||!inputEl.value.trim())return false;answers.push({sentence:currentSentence,answer:inputEl.value.trim(),correct:null,seconds:Math.max(0,Math.round((Date.now()-questionAt)/100)/10),elapsedSeconds:Math.round(seconds()*10)/10});currentSentence=null;inputEl.value='';return true}
  function nextSentence(){if(!active||!saveCurrent())return;showSentence()}
  function renderScore(){const s=state(),el=$('teacherScore');if(el)el.textContent=s.pending?'Score: Pending — '+answers.filter(a=>a.correct===null).length+' response(s) still need a teacher check':s.attempts?'Score: '+s.percentage+'% · '+s.correct+' correct out of '+s.attempts:'No responses recorded.';notify()}
  function renderReport(){summaryDiv.innerHTML='<h2>Teacher Check</h2><p><strong>Date:</strong> '+new Date().toLocaleDateString()+' · <strong>Total time:</strong> '+elapsed.toFixed(1)+' s</p><p id="teacherScore"></p><p>Read each response in context. Select Correct or Incorrect; leave it Pending if it has not been reviewed. More than one word can correctly complete these sentences.</p>'+answers.map((a,i)=>'<section style="padding:.8rem;margin:.6rem 0;border:1px solid #cfe2ed;border-radius:10px;text-align:left"><strong>'+esc(a.sentence)+'</strong><p>'+esc(a.answer)+' · '+a.seconds.toFixed(1)+' s</p><label>Teacher rating <select data-grade="'+i+'" style="font:inherit;min-height:44px"><option value="pending">Pending — not graded</option><option value="correct">Correct</option><option value="incorrect">Incorrect</option></select></label></section>').join('')+'<button type="button" id="restartCheck">Start a New Check</button> <button type="button" id="printCheck">Print / Save PDF</button>';summaryDiv.style.display='block';summaryDiv.querySelectorAll('[data-grade]').forEach(select=>select.addEventListener('change',()=>{answers[Number(select.dataset.grade)].correct=select.value==='pending'?null:select.value==='correct';renderScore()}));$('restartCheck').addEventListener('click',()=>startGame());$('printCheck').addEventListener('click',()=>window.print());renderScore()}
  function stopGame(){if(!active)return;saveCurrent();elapsed=seconds();active=false;stopTimer();inputEl.disabled=true;nextBtn.disabled=true;stopBtn.disabled=true;startBtn.disabled=false;feedbackEl.textContent='';renderReport()}
  startBtn.addEventListener('click',()=>startGame());nextBtn.addEventListener('click',nextSentence);stopBtn.addEventListener('click',stopGame);inputEl.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.repeat){event.preventDefault();nextSentence()}});
  document.addEventListener('beard:run-start',event=>startGame(event.detail&&event.detail.settings));
  window.BeardAssessmentState={getReport:state,reset:()=>startGame(),stop:stopGame};window.BeardAssessment={start:startGame,reset:startGame,stop:stopGame,getState:state};
})();
</script>
</body>
</html>
